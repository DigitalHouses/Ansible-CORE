---
# Task 08: maintain the site-scoped Semaphore API access on the central DEV.
# Also called once by fresh bootstrap after Runner -> PVE SSH enrollment.
- name: 08 - Ensure dedicated Semaphore API access on Runner
  hosts: runner
  connection: local
  become: true
  gather_facts: false
  vars_files:
    - /etc/digitalhouses/pve.yml
  vars:
    semaphore_api: http://127.0.0.1/api
  tasks:
    - name: Read this Runner's site identity
      ansible.builtin.slurp:
        src: /etc/digitalhouses/site-id
      register: dev_site_file

    - name: Validate site and trusted PVE target
      ansible.builtin.assert:
        that:
          - (dev_site_file.content | b64decode | trim) is match('^[a-z][a-z0-9]*(-[a-z0-9]+)+$')
          - pve.ipv4 is match('^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$')
          - pve.node is match('^[a-zA-Z0-9][a-zA-Z0-9-]*$')
        fail_msg: Invalid site identity or PVE inventory; task 08 stopped

    - name: Keep site identity for DEV enrollment
      ansible.builtin.set_fact:
        dev_site_id: "{{ dev_site_file.content | b64decode | trim }}"

    - name: Read the existing catalog credential on Runner only
      ansible.builtin.slurp:
        src: /etc/semaphore/catalog-token
      register: dev_catalog_secret
      no_log: true

    - name: Keep administrative credential only in Runner memory
      ansible.builtin.set_fact:
        dev_admin_token: "{{ dev_catalog_secret.content | b64decode | trim }}"
      no_log: true

    - name: Identify this site's Semaphore project
      ansible.builtin.uri:
        url: "{{ semaphore_api }}/projects"
        headers:
          Authorization: "Bearer {{ dev_admin_token }}"
        validate_certs: true
        use_proxy: false
      register: dev_site_projects
      no_log: true

    - name: Refuse ambiguous site project
      ansible.builtin.assert:
        that:
          - dev_site_projects.json | selectattr('name', 'equalto', dev_site_id) | list | length == 1
        fail_msg: Expected exactly one matching Semaphore site project

    - name: Reuse the bootstrap implementation for dedicated DEV access
      ansible.builtin.import_tasks: ../bootstrap/tasks/dev-access.yml
      vars:
        site_id: "{{ dev_site_id }}"
        dev_project_id: "{{ (dev_site_projects.json | selectattr('name', 'equalto', dev_site_id) | first).id }}"

    - name: Read protected transfer configuration
      ansible.builtin.slurp:
        src: /etc/semaphore/dev-automation.curl
      register: dev_transfer_config
      no_log: true

    - name: Read Runner management address independently of Semaphore browser URL
      ansible.builtin.command:
        argv: [/usr/sbin/ip, -4, -o, addr, show, dev, eth0]
      register: dev_runner_management
      changed_when: false

    - name: Require a valid and unique Runner management IPv4
      ansible.builtin.assert:
        that:
          - dev_runner_management.stdout_lines | length == 1
          - "'inet ' in dev_runner_management.stdout"
          - dev_runner_management.stdout.split('inet ')[1].split('/')[0] is match('^([0-9]{1,3}[.]){3}[0-9]{1,3}$')
        fail_msg: "Cannot identify trusted Runner management IPv4 on eth0"

    - name: Keep the actual site Runner IPv4 for DEV API smoke tests
      ansible.builtin.set_fact:
        dev_runner_ip: "{{ dev_runner_management.stdout.split('inet ')[1].split('/')[0] }}"

    - name: Register the existing pinned PVE SSH connection
      ansible.builtin.add_host:
        name: dev_delivery_pve
        groups: dev_delivery_hosts
        ansible_host: "{{ pve.ipv4 }}"
        ansible_user: root
        ansible_connection: ssh
        ansible_ssh_private_key_file: /var/lib/semaphore/.ssh/id_ed25519
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=yes -o ConnectTimeout=10
          -o UserKnownHostsFile=/var/lib/semaphore/.ssh/known_hosts
        ansible_python_interpreter: /usr/bin/python3
        expected_pve_node: "{{ pve.node }}"
      changed_when: false

- name: 08 - Deliver and verify dedicated API access in central DEV
  hosts: dev_delivery_hosts
  gather_facts: false
  become: false
  vars:
    dev_ctid: '1254'
    dev_ip_cidr: 192.168.11.254/24
    dev_dir: /home/dev/.config/ansible-core
    dev_site_id: "{{ hostvars['runner'].dev_site_id }}"
    dev_runner_ip: "{{ hostvars['runner'].dev_runner_ip }}"
    dev_api_url: "http://{{ dev_runner_ip }}/api"
    dev_curl_path: "{{ dev_dir }}/{{ dev_site_id }}.curl"
  tasks:
    - name: Use the shared transport without introducing another service
      ansible.builtin.include_tasks: ../tasks/dev-delivery.yml
