---
# 40 | CORE PVE/PBS audit and isolated pbs-core datastore preparation.
# Cloudflare WARP was retired in favor of Tailscale task 71.
# This task never modifies network clients, VMs, existing pool or old datastore.
- name: "40 | Register pinned CORE PVE"
  hosts: runner
  connection: local
  gather_facts: false
  vars_files:
    - /etc/digitalhouses/pve.yml
  vars:
    core40_action: "{{ DH_CORE40_ACTION | default('audit', true) }}"
    core40_site: "{{ lookup('ansible.builtin.file', '/etc/digitalhouses/site-id') | trim }}"
    core40_profile: "{{ lookup('ansible.builtin.file', '/etc/digitalhouses/site-profile') | trim }}"
  tasks:
    - name: Refuse another site or retired WARP actions
      ansible.builtin.assert:
        that:
          - core40_action in ['audit', 'prepare']
          - core40_site == 'dh-core'
          - core40_profile == 'core'
          - pve.ipv4 == '192.168.11.240'
          - pve.node | length > 0
        fail_msg: CORE40_WRONG_SITE_OR_RETIRED_WARP_ACTION

    - name: Register only central Proxmox host
      ansible.builtin.add_host:
        name: core40_pve
        groups: core40_pve_group
        ansible_host: "{{ pve.ipv4 }}"
        ansible_user: root
        ansible_connection: ssh
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: /var/lib/semaphore/.ssh/id_ed25519
        ansible_ssh_common_args: >-
          -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile=/var/lib/semaphore/.ssh/known_hosts
        core40_action: "{{ core40_action }}"
        core40_expected_node: "{{ pve.node }}"
        core40_pve_ipv4: "{{ pve.ipv4 }}"
      changed_when: false
      no_log: true

- name: "40 | Audit CORE PVE and protect PBS datastore"
  hosts: core40_pve_group
  gather_facts: false
  tasks:
    - name: Read actual CORE PVE node name
      ansible.builtin.command:
        argv: [hostname, -s]
      register: core40_hostname
      changed_when: false

    - name: Refuse another PVE
      ansible.builtin.assert:
        that: core40_hostname.stdout | trim == core40_expected_node
        fail_msg: CORE40_PINNED_PVE_IDENTITY_MISMATCH

    - name: List existing VMs without changes
      ansible.builtin.command:
        argv: [pvesh, get, "/nodes/{{ core40_expected_node }}/qemu", --output-format, json]
      register: core40_qemu_raw
      changed_when: false

    - name: Read configured storage without credentials
      ansible.builtin.command:
        argv: [pvesh, get, "/nodes/{{ core40_expected_node }}/storage", --output-format, json]
      register: core40_storage_raw
      changed_when: false

    - name: Identify standard and legacy resources
      ansible.builtin.set_fact:
        core40_media_standard: "{{ (core40_qemu_raw.stdout | from_json) | selectattr('vmid', 'equalto', 2243) | list }}"
        core40_media_legacy: "{{ (core40_qemu_raw.stdout | from_json) | selectattr('vmid', 'equalto', 2250) | list }}"
        core40_storage_legacy: "{{ (core40_storage_raw.stdout | from_json) | selectattr('storage', 'equalto', 'pbs-serzhan') | list }}"
        core40_storage_central: "{{ (core40_storage_raw.stdout | from_json) | selectattr('storage', 'equalto', 'pbs-core') | list }}"

    - name: Refuse duplicate CORE identities
      ansible.builtin.assert:
        that:
          - core40_media_standard | length <= 1
          - core40_media_legacy | length <= 1
          - core40_storage_central | length <= 1
        fail_msg: CORE40_DUPLICATED_IDENTITY

    - name: Prepare only dedicated CORE PBS ZFS datastore when requested
      ansible.builtin.include_tasks: ../tasks/core40-pbs-datastore.yml
      when: core40_action == 'prepare'

    - name: Audit legacy CORE PVE PBS storage mapping and scheduled dependencies
      ansible.builtin.include_tasks: ../tasks/core40-legacy-pbs-audit.yml
      when: core40_action == 'audit'

    - name: Report CORE inventory without touching WARP, backups or datasets
      ansible.builtin.debug:
        msg:
          - "CORE40_MODE={{ core40_action | upper }}"
          - "CORE40_PVE=dh-core/{{ core40_pve_ipv4 }}"
          - "CORE40_VM2243={{ 'PRESENT' if core40_media_standard | length else 'ABSENT' }}"
          - "CORE40_VM2250_LEGACY={{ 'PRESENT' if core40_media_legacy | length else 'ABSENT' }}"
          - "CORE40_PVE_STORAGE_PBS_SERZHAN={{ 'PRESENT' if core40_storage_legacy | length else 'NOT_CONFIGURED' }}"
          - "CORE40_PVE_STORAGE_PBS_CORE={{ 'PRESENT' if core40_storage_central | length else 'NOT_CONFIGURED' }}"
          - CORE40_VPN=TAILSCALE_OWNED_BY_TASK71
          - CORE40_BACKUPS=OWNED_BY_TASK50
