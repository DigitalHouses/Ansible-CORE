---
# CORE Media Server 30: test the actual VM2243 and LAN service links.
# repair-portal uses the existing VM static ipconfig0 as its single IP parameter.
# No VM, ZFS, PBS or passwords are changed.
- name: "30 | Identify CORE Media Server test target"
  hosts: runner
  connection: local
  gather_facts: false
  vars_files:
    - /etc/digitalhouses/pve.yml
  vars:
    core_media_site: "{{ lookup('ansible.builtin.file', '/etc/digitalhouses/site-id') | trim }}"
    core_media_profile: "{{ lookup('ansible.builtin.file', '/etc/digitalhouses/site-profile') | trim }}"
    core_media_action: "{{ DH_CORE_MEDIA_ACTION | default('audit', true) }}"
  tasks:
    - name: Require pinned CORE runner and explicit non-destructive action
      ansible.builtin.assert:
        that:
          - core_media_site == 'dh-core'
          - core_media_profile == 'core'
          - pve.ipv4 == '192.168.11.240'
          - pve.node | length > 0
          - core_media_action in ['audit', 'repair-portal']
        fail_msg: CORE_MEDIA30_WRONG_SITE_OR_ACTION

    - name: Register existing trusted CORE PVE only
      ansible.builtin.add_host:
        name: core_media_pve
        groups: core_media_pve_group
        ansible_host: "{{ pve.ipv4 }}"
        ansible_user: root
        ansible_connection: ssh
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: /var/lib/semaphore/.ssh/id_ed25519
        ansible_ssh_common_args: >-
          -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile=/var/lib/semaphore/.ssh/known_hosts
        core_media_expected_pve: "{{ pve.node }}"
        core_media_pve_ipv4: "{{ pve.ipv4 }}"
        core_media_action: "{{ core_media_action }}"
      changed_when: false

- name: "30 | E2E CORE VM2243 portal links and service availability"
  hosts: core_media_pve_group
  gather_facts: false
  vars:
    # Single source of truth: Proxmox VM2243 static ipconfig0 (not a literal IP).
    core_media_ipv4: >-
      {{ (core_media_vm_config.stdout
          | regex_findall('(?m)^ipconfig0: ip=([0-9.]+)/24,gw=')
          | first | default('')) }}
    core_media_network: "{{ core_media_ipv4.split('.')[:3] | join('.') }}.0/24"
    core_media_portal_file: /var/www/dh-media-portal/index.html
    core_media_targets:
      - {name: Plex, url: "http://{{ core_media_ipv4 }}:32400/web/"}
      - {name: Jellyfin, url: "http://{{ core_media_ipv4 }}:8096/"}
      - {name: Filestash, url: "http://{{ core_media_ipv4 }}:8334/"}
      - {name: Sambee, url: "http://{{ core_media_ipv4 }}:8000/"}
      - {name: Radarr, url: "http://{{ core_media_ipv4 }}:7878/"}
      - {name: Sonarr, url: "http://{{ core_media_ipv4 }}:8989/"}
      - {name: Prowlarr, url: "http://{{ core_media_ipv4 }}:9696/"}
      - {name: qBittorrent, url: "http://{{ core_media_ipv4 }}:8080/"}
      - {name: Account, url: "https://{{ core_media_ipv4 }}/account/"}
      - {name: Webmin, url: "https://{{ core_media_ipv4 }}:10000/"}
      - {name: rclone, url: "http://{{ core_media_ipv4 }}:5580/login?url=http%3A%2F%2F{{ core_media_ipv4 }}%3A5572%2F"}
      - {name: PBS, url: "https://{{ core_media_ipv4 }}:8007/"}
  tasks:
    - name: Verify real CORE PVE hostname
      ansible.builtin.command:
        argv: [hostname, -s]
      register: core_media_pve_hostname
      changed_when: false

    - name: Require the pinned CORE PVE identity
      ansible.builtin.assert:
        that: core_media_pve_hostname.stdout | trim == core_media_expected_pve
        fail_msg: CORE_MEDIA30_PVE_IDENTITY_MISMATCH

    - name: Read actual existing media VM configuration
      ansible.builtin.command:
        argv: [qm, config, '2243']
      register: core_media_vm_config
      changed_when: false

    - name: Require the CORE media guest and canonical configured IP
      ansible.builtin.assert:
        that:
          - >-
            core_media_vm_config.stdout is search('(?m)^name: mediaserver-serzhan$')
          - core_media_ipv4 is match('^[0-9]{1,3}([.][0-9]{1,3}){3}$')
          - core_media_ipv4.split('.')[:3] == core_media_pve_ipv4.split('.')[:3]
          - >-
            core_media_vm_config.stdout is search(
              '(?m)^ipconfig0: ip=' ~ (core_media_ipv4 | regex_escape) ~ '/24,gw=')
          - >-
            core_media_vm_config.stdout is search('(?m)^agent: enabled=1')
        fail_msg: CORE_MEDIA30_VM2243_IDENTITY_OR_IP_MISMATCH

    - name: Require media VM2243 is actually running
      ansible.builtin.command:
        argv: [qm, status, '2243']
      register: core_media_vm_status
      changed_when: false
      failed_when: >-
        core_media_vm_status.stdout | trim != 'status: running'

    - name: Read actual guest LAN addresses through QEMU Guest Agent
      ansible.builtin.command:
        argv: [qm, guest, exec, '2243', --, hostname, -I]
      register: core_media_guest_ip_raw
      changed_when: false

    - name: Require the running guest owns its declared LAN address
      ansible.builtin.assert:
        that:
          - core_media_guest_ip_raw.rc == 0
          - (core_media_guest_ip_raw.stdout | from_json).exitcode | int == 0
          - core_media_ipv4 in (core_media_guest_ip_raw.stdout | from_json)['out-data'].split()
        fail_msg: CORE_MEDIA30_GUEST_LAN_IP_MISMATCH

    - name: Validate active NoCloud network and retained guest cache against the VM IP parameter
      ansible.builtin.include_tasks: ../tasks/core30-media-cloudinit.yml

    - name: Require the deployed portal document exists
      ansible.builtin.command:
        argv: [qm, guest, exec, '2243', --, test, -f, "{{ core_media_portal_file }}"]
      register: core_media_portal_file_status
      changed_when: false
      failed_when: >-
        core_media_portal_file_status.rc != 0 or
        (core_media_portal_file_status.stdout | from_json).exitcode | int != 0

    - name: Fetch current portal HTML from the actual CORE guest
      ansible.builtin.uri:
        url: "http://{{ core_media_ipv4 }}/"
        return_content: true
        status_code: 200
        use_proxy: false
        timeout: 12
      register: core_media_portal_before
      changed_when: false

    - name: Collect visible IPv4 references without guessing a browser cache state
      ansible.builtin.set_fact:
        core_media_before_ipv4: >-
          {{ core_media_portal_before.content
             | regex_findall('(?:[0-9]{1,3}[.]){3}[0-9]{1,3}') | unique | list }}

    - name: Refuse to rewrite unrelated IPs or unexpected web content
      ansible.builtin.assert:
        that:
          - "'DigitalHouses' in core_media_portal_before.content"
          - core_media_before_ipv4 | length == 1
          - >-
            core_media_before_ipv4[0].split('.')[:3] ==
            core_media_ipv4.split('.')[:3]
        fail_msg: CORE_MEDIA30_PORTAL_HAS_UNKNOWN_ADDRESSES

    - name: Repair observed stale portal links using the VM's configured IP
      ansible.builtin.command:
        argv:
          - qm
          - guest
          - exec
          - '2243'
          - --
          - sed
          - -i
          - "s|{{ core_media_before_ipv4[0] | regex_escape }}|{{ core_media_ipv4 }}|g"
          - "{{ core_media_portal_file }}"
      register: core_media_portal_repair
      changed_when: true
      failed_when: >-
        core_media_portal_repair.rc != 0 or
        (core_media_portal_repair.stdout | from_json).exitcode | int != 0
      when:
        - core_media_action == 'repair-portal'
        - core_media_before_ipv4[0] != core_media_ipv4

    - name: Synchronize account redirects, nginx LAN ACLs and HTTPS certificate to the VM IP
      ansible.builtin.include_tasks: ../tasks/core30-media-nginx-tls.yml

    - name: Read live portal after audit or surgical repair
      ansible.builtin.uri:
        url: "http://{{ core_media_ipv4 }}/"
        return_content: true
        status_code: 200
        use_proxy: false
        timeout: 12
      register: core_media_portal_after
      changed_when: false

    - name: Parse all actual clickable HTTP application URLs
      ansible.builtin.set_fact:
        core_media_links: >-
          {{ core_media_portal_after.content
             | regex_findall('<a[^>]*href="(https?://[^"]+)"') }}
        core_media_all_ip_refs: >-
          {{ core_media_portal_after.content
             | regex_findall('(?:[0-9]{1,3}[.]){3}[0-9]{1,3}') | unique | list }}

    - name: Require every portal URL and share uses the VM configured IPv4
      ansible.builtin.assert:
        that:
          - core_media_all_ip_refs == [core_media_ipv4]
          - core_media_links | length == 12
          - >-
            (core_media_links | select(
             'match', '^https?://' ~ (core_media_ipv4 | regex_escape) ~ '(:[0-9]+)?/'
             ) | list | length) == 12
          - "('smb://' ~ core_media_ipv4 ~ '/Media') in core_media_portal_after.content"
          - "('smb://' ~ core_media_ipv4 ~ '/Documents') in core_media_portal_after.content"
        fail_msg: CORE_MEDIA30_PORTAL_LINKS_NOT_CANONICAL

    - name: Probe all 12 actual LAN web services without logging in or changing state
      ansible.builtin.uri:
        url: "{{ item.url }}"
        method: GET
        follow_redirects: all
        status_code: 200
        validate_certs: false
        use_proxy: false
        timeout: 10
      loop: "{{ core_media_targets }}"
      loop_control:
        label: "{{ item.name }}"
      register: core_media_http_checks
      changed_when: false

    - name: Require every advertised web application responded
      ansible.builtin.assert:
        that:
          - core_media_http_checks.results | length == 12
          - >-
            core_media_http_checks.results
            | rejectattr('status', 'equalto', 200) | list | length == 0
        fail_msg: CORE_MEDIA30_WEB_SERVICE_E2E_FAILED

    - name: Require Samba server accepts TCP from CORE PVE
      ansible.builtin.wait_for:
        host: "{{ core_media_ipv4 }}"
        port: 445
        state: started
        timeout: 8

    - name: Require protected rclone RC API rejects unauthenticated access
      ansible.builtin.uri:
        url: "http://{{ core_media_ipv4 }}:5572/"
        method: GET
        status_code: 401
        follow_redirects: none
        use_proxy: false
        timeout: 8
      register: core_media_rclone_reject
      changed_when: false

    - name: Report CORE Media Server E2E acceptance without changing PBS or VM
      ansible.builtin.debug:
        msg:
          - "CORE_MEDIA30_ACTION={{ core_media_action }}"
          - CORE_MEDIA30_VM=2243
          - CORE_MEDIA30_IP_SOURCE=PVE_VM_IPCONFIG0
          - "CORE_MEDIA30_NGINX_CONFIG={{ 'REPAIRED' if core30_nginx_reload is changed else 'ALREADY_CURRENT' }}"
          - CORE_MEDIA30_TLS_IDENTITY=VM_IP_VERIFIED
          - CORE_MEDIA30_CLOUDINIT=VM_IP_VERIFIED
          - "CORE_MEDIA30_CLOUDINIT_REPAIRED={{ core30_cloud_cache_repaired is changed }}"
          - "CORE_MEDIA30_GUEST_IP={{ core_media_ipv4 }}"
          - "CORE_MEDIA30_PORTAL_LINKS={{ core_media_links | length }} VALID"
          - "CORE_MEDIA30_WEB_SERVICES={{ core_media_http_checks.results | length }} HTTP_200"
          - CORE_MEDIA30_SMB=TCP_445_OPEN
          - CORE_MEDIA30_RCLONE_API=UNAUTHENTICATED_401
          - "CORE_MEDIA30_PORTAL_REPAIRED={{ core_media_portal_repair is changed }}"
          - CORE_MEDIA30_E2E=PASS
