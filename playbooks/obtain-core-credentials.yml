---
# 05 | Manage CORE-scoped credentials using the existing Semaphore Variable Group.
# Blank Survey fields preserve old values; no plaintext secrets or custom scripts.
- name: "05 | Save and inspect central CORE credentials"
  hosts: runner
  connection: local
  become: false
  gather_facts: false
  vars:
    core05_api: http://127.0.0.1/api
    core05_site: "{{ lookup('ansible.builtin.file', '/etc/digitalhouses/site-id') | trim }}"
    core05_profile: "{{ lookup('ansible.builtin.file', '/etc/digitalhouses/site-profile') | trim }}"
    core05_provided:
      DH_CLOUDFLARE_API_TOKEN: "{{ lookup('ansible.builtin.env', 'DH_INPUT_CLOUDFLARE_API_TOKEN') }}"
      DH_CLOUDFLARE_TEAM_NAME: "{{ lookup('ansible.builtin.env', 'DH_INPUT_CLOUDFLARE_TEAM_NAME') }}"
      DH_CLOUDFLARE_ENROLL_CLIENT_ID: "{{ lookup('ansible.builtin.env', 'DH_INPUT_CLOUDFLARE_ENROLL_CLIENT_ID') }}"
      DH_CLOUDFLARE_ENROLL_CLIENT_SECRET: "{{ lookup('ansible.builtin.env', 'DH_INPUT_CLOUDFLARE_ENROLL_CLIENT_SECRET') }}"
      DH_TAILSCALE_AUTH_KEY: "{{ lookup('ansible.builtin.env', 'DH_INPUT_TAILSCALE_AUTH_KEY') }}"
    core05_secret_names:
      - DH_CLOUDFLARE_API_TOKEN
      - DH_CLOUDFLARE_ENROLL_CLIENT_ID
      - DH_CLOUDFLARE_ENROLL_CLIENT_SECRET
      - DH_TAILSCALE_AUTH_KEY
  tasks:
    - name: Require CORE runner identity before reading credentials
      ansible.builtin.assert:
        that:
          - core05_site == 'dh-core'
          - core05_profile == 'core'
        fail_msg: CORE05_MUST_RUN_FROM_DH_CORE_SEMAPHORE

    - name: Keep only explicitly submitted nonblank fields
      ansible.builtin.set_fact:
        core05_supplied: "{{ core05_provided | dict2items | rejectattr('value', 'equalto', '') | list | items2dict }}"
      no_log: true

    - name: Check submitted Cloudflare team name format
      ansible.builtin.assert:
        that:
          - core05_supplied.DH_CLOUDFLARE_TEAM_NAME is match('^[a-z0-9][a-z0-9-]{0,62}$')
        fail_msg: CORE05_INVALID_CLOUDFLARE_TEAM_NAME
      when: "'DH_CLOUDFLARE_TEAM_NAME' in core05_supplied"
      no_log: true

    - name: Read existing local Semaphore catalog API token
      ansible.builtin.slurp:
        src: /etc/semaphore/catalog-token
      register: core05_catalog_token
      no_log: true

    - name: Identify exactly one CORE Semaphore project
      ansible.builtin.uri:
        url: "{{ core05_api }}/projects"
        method: GET
        headers:
          Authorization: "Bearer {{ core05_catalog_token.content | b64decode | trim }}"
        use_proxy: false
        status_code: 200
      register: core05_projects
      no_log: true

    - name: Select the dedicated dh-core project
      ansible.builtin.set_fact:
        core05_site_projects: "{{ core05_projects.json | selectattr('name', 'equalto', core05_site) | list }}"
      no_log: true

    - name: Refuse ambiguous or missing CORE project
      ansible.builtin.assert:
        that: core05_site_projects | length == 1
        fail_msg: CORE05_PROJECT_IDENTITY_MISMATCH

    - name: Read existing Semaphore Variable Groups
      ansible.builtin.uri:
        url: "{{ core05_api }}/project/{{ core05_site_projects[0].id }}/environment"
        method: GET
        headers:
          Authorization: "Bearer {{ core05_catalog_token.content | b64decode | trim }}"
        use_proxy: false
        status_code: 200
      register: core05_groups
      no_log: true

    - name: Locate only the pre-existing shared Variable Group
      ansible.builtin.set_fact:
        core05_native_groups: "{{ core05_groups.json | selectattr('name', 'equalto', 'Empty') | list }}"
      no_log: true

    - name: Refuse missing or ambiguous shared Variable Group
      ansible.builtin.assert:
        that:
          - core05_native_groups | length == 1
          - core05_native_groups[0].project_id == core05_site_projects[0].id
        fail_msg: CORE05_NATIVE_VARIABLE_GROUP_NOT_FOUND

    - name: Read Variable Group and existing secret metadata
      ansible.builtin.uri:
        url: "{{ core05_api }}/project/{{ core05_site_projects[0].id }}/environment/{{ core05_native_groups[0].id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ core05_catalog_token.content | b64decode | trim }}"
        use_proxy: false
        status_code: 200
      register: core05_group_info
      no_log: true

    - name: Prepare existing values and secret-name metadata
      ansible.builtin.set_fact:
        core05_existing_env: "{{ core05_group_info.json.env | from_json }}"
        core05_secret_ops: []
        core05_stored_secret_names: "{{ core05_group_info.json.secrets | default([]) | map(attribute='name') | list }}"
      no_log: true

    - name: Prepare only explicitly submitted native secret upserts
      ansible.builtin.set_fact:
        core05_secret_ops: >-
          {{ core05_secret_ops + [
            {'name': item, 'type': 'var', 'secret': core05_supplied[item],
             'operation': 'update' if current | length else 'create'}
             | combine({'id': current[0].id} if current | length else {})
          ] }}
      vars:
        current: "{{ core05_group_info.json.secrets | default([]) | selectattr('name', 'equalto', item) | list }}"
      loop: "{{ core05_secret_names }}"
      when: item in core05_supplied
      no_log: true

    - name: Preserve existing nonsecret values and merge submitted team name
      ansible.builtin.set_fact:
        core05_updated_env: >-
          {{ core05_existing_env
             | combine({'DH_CLOUDFLARE_TEAM_NAME': core05_supplied.DH_CLOUDFLARE_TEAM_NAME}
                       if 'DH_CLOUDFLARE_TEAM_NAME' in core05_supplied else {}) }}
      no_log: true

    - name: Update only submitted credentials in the existing Variable Group
      ansible.builtin.uri:
        url: "{{ core05_api }}/project/{{ core05_site_projects[0].id }}/environment/{{ core05_native_groups[0].id }}"
        method: PUT
        body_format: json
        body:
          id: "{{ core05_native_groups[0].id }}"
          project_id: "{{ core05_site_projects[0].id }}"
          name: "{{ core05_native_groups[0].name }}"
          json: "{{ core05_group_info.json.json }}"
          env: "{{ core05_updated_env | to_json }}"
          secrets: "{{ core05_secret_ops }}"
        headers:
          Authorization: "Bearer {{ core05_catalog_token.content | b64decode | trim }}"
        use_proxy: false
        status_code: [200, 204]
      when: core05_supplied | length > 0
      no_log: true

    - name: Read saved Variable Group back when fields were submitted
      ansible.builtin.uri:
        url: "{{ core05_api }}/project/{{ core05_site_projects[0].id }}/environment/{{ core05_native_groups[0].id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ core05_catalog_token.content | b64decode | trim }}"
        use_proxy: false
        status_code: 200
      register: core05_readback
      when: core05_supplied | length > 0
      no_log: true

    - name: Confirm submitted fields were saved without losing existing field names
      ansible.builtin.assert:
        that:
          - >-
            (core05_stored_secret_names | difference(
              core05_readback.json.secrets | default([]) | map(attribute='name') | list)
             | length) == 0
          - >-
            (core05_supplied.keys() | list | intersect(core05_secret_names)
             | difference(core05_readback.json.secrets | default([]) | map(attribute='name') | list)
             | length) == 0
          - (core05_readback.json.env | from_json) == core05_updated_env
        fail_msg: CORE05_VARIABLE_GROUP_READBACK_MISMATCH
      when: core05_supplied | length > 0
      no_log: true

    - name: Calculate readiness using secret names only
      ansible.builtin.set_fact:
        core05_present_secret_names: >-
          {{ (core05_stored_secret_names +
              (core05_supplied.keys() | list
               | intersect(core05_secret_names))) | unique | list }}
        core05_team_name: >-
          {{ core05_supplied.DH_CLOUDFLARE_TEAM_NAME
             | default(core05_existing_env.DH_CLOUDFLARE_TEAM_NAME | default(''), true) }}
      no_log: true

    - name: Verify submitted or previously available Cloudflare API token
      ansible.builtin.uri:
        url: https://api.cloudflare.com/client/v4/user/tokens/verify
        method: GET
        headers:
          Authorization: "Bearer {{ core05_supplied.DH_CLOUDFLARE_API_TOKEN | default(DH_CLOUDFLARE_API_TOKEN | default(''), true) }}"
        use_proxy: false
        timeout: 12
        return_content: true
        status_code: [200, 400, 401, 403, 429]
      register: core05_cf_verify
      when: (core05_supplied.DH_CLOUDFLARE_API_TOKEN | default(DH_CLOUDFLARE_API_TOKEN | default(''), true)) | length > 0
      failed_when: false
      changed_when: false
      no_log: true

    - name: Report credential readiness without exposing values
      ansible.builtin.debug:
        msg:
          - CORE05_VARIABLE_GROUP=REUSED
          - "CORE05_UPDATED_FIELDS={{ core05_supplied | length }}"
          - "CORE05_CF_API_TOKEN={{ 'NOT_CONFIGURED' if 'DH_CLOUDFLARE_API_TOKEN' not in core05_present_secret_names else ('VERIFIED' if (core05_cf_verify.status | default(0) == 200 and (core05_cf_verify.json | default({})).get('success', false) and (core05_cf_verify.json | default({})).get('result', {}).get('status') == 'active') else 'SAVED_UNVERIFIED') }}"
          - "CORE05_CF_TEAM_NAME={{ 'CONFIGURED' if core05_team_name | length > 0 else 'NOT_CONFIGURED' }}"
          - "CORE05_CF_ENROLL_CLIENT_ID={{ 'CONFIGURED' if 'DH_CLOUDFLARE_ENROLL_CLIENT_ID' in core05_present_secret_names else 'NOT_CONFIGURED' }}"
          - "CORE05_CF_ENROLL_CLIENT_SECRET={{ 'CONFIGURED' if 'DH_CLOUDFLARE_ENROLL_CLIENT_SECRET' in core05_present_secret_names else 'NOT_CONFIGURED' }}"
          - CORE05_ENROLLMENT_VERIFICATION=NOT_PERFORMED
          - CORE05_SCOPE=DH_CORE_ONLY
