---
# CORE-only lifecycle: create an absent CT, or update an existing installation.
- name: "60 | Validate CORE DH Stats target"
  hosts: runner
  connection: local
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - /etc/digitalhouses/pve.yml
    - ../vars/core-resource-standard.yml
  vars:
    core60_action: "{{ DH_CORE60_ACTION | default('update', true) }}"
  tasks:
    - name: Require a supported lifecycle action and CORE PVE
      ansible.builtin.assert:
        that:
          - core60_action in ['create', 'update']
          - pve.ipv4 == '192.168.11.240'
    - name: Verify CORE bootstrap and IP/ID ownership
      ansible.builtin.include_tasks: ../tasks/core-resource-standard-assert.yml

    - name: Register only the trusted CORE PVE target
      ansible.builtin.add_host:
        name: core60_pve
        groups: core60_pve_hosts
        ansible_host: "{{ pve.ipv4 }}"
        ansible_user: root
        ansible_connection: ssh
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: /var/lib/semaphore/.ssh/id_ed25519
        ansible_ssh_common_args: >-
          -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile=/var/lib/semaphore/.ssh/known_hosts
        core60_expected_node: "{{ pve.node }}"
        core60_action: "{{ core60_action }}"
      changed_when: false
      no_log: true

- name: "60 | Resolve managed CT on CORE PVE"
  hosts: core60_pve_hosts
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - ../vars/core-resource-standard.yml
  tasks:
    - name: Confirm actual CORE PVE node identity
      ansible.builtin.command:
        argv: [hostname, -s]
      register: core60_hostname
      changed_when: false

    - name: Refuse to inspect another Proxmox host
      ansible.builtin.assert:
        that:
          - core60_hostname.stdout | trim == core60_expected_node
        fail_msg: CORE60_PVE_IDENTITY_MISMATCH

    - name: Read all Proxmox guest IDs and names without changes
      ansible.builtin.command:
        argv: [pvesh, get, /cluster/resources, --type, vm, --output-format, json]
      register: core60_resources_raw
      changed_when: false

    - name: Find target ID and canonical-name conflicts
      ansible.builtin.set_fact:
        core60_resources: "{{ core60_resources_raw.stdout | from_json }}"
        core60_existing_id: >-
          {{ (core60_resources_raw.stdout | from_json)
             | selectattr('vmid', 'equalto', core_stats_ctid | int) | list }}
        core60_existing_name: >-
          {{ (core60_resources_raw.stdout | from_json)
             | selectattr('name', 'defined')
             | selectattr('name', 'equalto', core_resource_standard.stats_ct_name) | list }}

    - name: Read PVE LAN address without changing it
      ansible.builtin.command:
        argv: [ip, -4, -o, addr, show, dev, vmbr0]
      register: core60_pve_lan_raw
      changed_when: false

    - name: Require exact CORE LAN block and matching CTID rule
      ansible.builtin.assert:
        that:
          - core60_pve_lan_raw.stdout is search('192[.]168[.]11[.]240/24')
          - (core_stats_ctid | int) == (core_resource_standard.ct_offset | int) + (core_resource_standard.stats_octet | int)
        fail_msg: CORE60_PVE_LAN_OR_ID_DRIFT

    - name: Reject foreign ID or name and require existing CT for update
      ansible.builtin.assert:
        that:
          - core60_existing_id | length <= 1
          - core60_existing_name | length <= 1
          - core60_existing_id | length == 0 or (core60_existing_id[0].type == 'lxc' and core60_existing_id[0].name == core_resource_standard.stats_ct_name)
          - core60_existing_name | length == 0 or core60_existing_name[0].vmid | int == core_stats_ctid | int
          - core60_action != 'update' or core60_existing_id | length == 1
        fail_msg: CORE60_FOREIGN_TARGET_OR_CREATE_REQUIRED

    - name: Determine whether creation is required
      ansible.builtin.set_fact:
        core60_create_required: "{{ core60_action == 'create' and core60_existing_id | length == 0 }}"

    - name: Preserve an existing CT when Create is selected
      ansible.builtin.debug:
        msg: CORE60_CREATE=ALREADY_EXISTS_USE_UPDATE
      when: core60_action == 'create' and not (core60_create_required | bool)

    - name: Verify address vacancy only before creating a new CT
      when: core60_create_required | bool
      block:
        - name: Determine whether arping is available on CORE PVE
          ansible.builtin.command:
            argv: [sh, -c, 'command -v arping']
          register: core60_arping_binary
          changed_when: false
          failed_when: false
    
        - name: Probe for live CORE LAN address collision via ARP duplicate-address detection
          ansible.builtin.command:
            argv: [arping, -D, -I, vmbr0, -c, '3', -w, '4', '192.168.11.245']
          register: core60_arping_probe
          changed_when: false
          failed_when: false
          when: core60_arping_binary.rc == 0
        - name: Require vacant IP before creating any Cloudflare or PVE resource
          ansible.builtin.assert:
            that:
              - core60_arping_binary.rc == 0
              - core60_arping_probe.rc | default(1) == 0
            fail_msg: CORE60_IP_NOT_CONFIRMED_FREE

- name: "60 | Prepare Cloudflare only for a new installation"
  hosts: runner
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Prepare dedicated tunnel and token
      when: hostvars['core60_pve'].core60_create_required | bool
      block:
        - name: Read current Cloudflare resources
          ansible.builtin.include_tasks: ../tasks/core60-cloudflare-audit.yml
        - name: Refuse to take over unrelated existing telemetry DNS
          ansible.builtin.assert:
            that:
              - core60_cf_dns.json.result | length <= 1
              - >-
                core60_cf_dns.json.result | length == 0 or
                (core60_cf_tunnels.json.result | length == 1 and
                 core60_cf_dns.json.result[0].type == 'CNAME' and
                 core60_cf_dns.json.result[0].content == core60_cf_tunnels.json.result[0].id ~ '.cfargotunnel.com')
            fail_msg: CORE60_TELEMETRY_DNS_ALREADY_OWNED_BY_ANOTHER_TARGET
        - name: Create or reuse the dedicated dh-core Tunnel
          ansible.builtin.include_tasks: ../tasks/core60-cloudflare-prepare.yml
        - name: Refresh Cloudflare state after tunnel preparation
          ansible.builtin.include_tasks: ../tasks/core60-cloudflare-audit.yml
          when: core60_cf_tunnels.json.result | length == 0
        - name: Retrieve only dedicated dh-core connector token for guest installation
          ansible.builtin.uri:
            url: "https://api.cloudflare.com/client/v4/accounts/{{ core60_cf_account_id }}/cfd_tunnel/{{ core60_cf_tunnels.json.result[0].id }}/token"
            method: GET
            headers:
              Authorization: "Bearer {{ DH_CLOUDFLARE_API_TOKEN }}"
            return_content: true
            use_proxy: false
          register: core60_connector_secret
          no_log: true
    
        - name: Refuse deploying through a missing or ambiguous dh-core Tunnel
          ansible.builtin.assert:
            that:
              - core60_cf_tunnels.json.result | length == 1
              - core60_cf_tunnels.json.result[0].name == 'dh-core'
              - core60_connector_secret.json.success | default(false) | bool
              - core60_connector_secret.json.result | length > 40
            fail_msg: CORE60_TUNNEL_TOKEN_MISSING
          no_log: true
        - name: Pass connector credential to the managed PVE host
          ansible.builtin.add_host:
            name: core60_pve
            core60_connector_token: "{{ core60_connector_secret.json.result }}"
          changed_when: false
          no_log: true

- name: "60 | Apply selected lifecycle operation"
  hosts: core60_pve_hosts
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - ../vars/core-resource-standard.yml
  tasks:
    - name: Create missing CT and install all DH Stats services
      ansible.builtin.include_tasks: ../tasks/core60-deploy.yml
      when: core60_create_required | bool

    - name: Update existing CT and application without deleting data
      when: core60_action == 'update'
      block:
        - name: Require a running managed CT
          ansible.builtin.assert:
            that:
              - core60_existing_id[0].status == 'running'
            fail_msg: CORE60_START_EXISTING_CT_BEFORE_UPDATE
        - name: Apply native boot fix and protected local origin
          ansible.builtin.include_tasks: ../tasks/core60-network-origin.yml
        - name: Update DH Stats application and dashboard
          ansible.builtin.include_tasks: ../tasks/core60-update-stats.yml

    - name: Verify all required services after the selected operation
      ansible.builtin.command:
        argv: [pct, exec, '1245', --, systemctl, is-active, systemd-journald, networking, nginx, postgresql, digitalhouses-stats, digitalhouses-stats-dashboard-api, cloudflared-dh-core]
      changed_when: false
      when: (core60_create_required | bool) or core60_action == 'update'

    - name: Mark successful local lifecycle operation
      ansible.builtin.set_fact:
        core60_local_complete: true
      when: (core60_create_required | bool) or core60_action == 'update'

- name: "60 | Publish new installation and verify public telemetry"
  hosts: runner
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Configure public telemetry only after successful local creation
      ansible.builtin.include_tasks: ../tasks/core60-cloudflare-cutover.yml
      when:
        - hostvars['core60_pve'].core60_create_required | bool
        - hostvars['core60_pve'].core60_local_complete | default(false) | bool

    - name: Verify public telemetry after successful local operation
      ansible.builtin.uri:
        url: https://telemetry.digitalhouses.vip/healthz
        method: GET
        return_content: true
        timeout: 8
        use_proxy: false
      register: core60_public_after
      changed_when: false
      retries: 6
      delay: 3
      until: core60_public_after.status | default(0) == 200 and core60_public_after.json.status | default('') == 'ok'
      when: hostvars['core60_pve'].core60_local_complete | default(false) | bool
