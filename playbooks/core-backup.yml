---
# 50 | Central Backup: audit or explicit pilot HOME receiving-side preparation.
# Remotes and Push jobs run only on HOME PBS. Never configure CORE Pull.
# Preserve existing datastore, ZFS, media, legacy tokens and backup jobs.
- name: "50 | Identify the trusted CORE runner and PVE"
  hosts: runner
  connection: local
  gather_facts: false
  vars_files:
    - /etc/digitalhouses/pve.yml
    - ../vars/core-resource-standard.yml
  vars:
    core50_site: "{{ lookup('ansible.builtin.file', '/etc/digitalhouses/site-id') | trim }}"
    core50_profile: "{{ lookup('ansible.builtin.file', '/etc/digitalhouses/site-profile') | trim }}"
    core50_action: "{{ DH_CORE50_ACTION | default('audit', true) }}"
    core50_home_id: "{{ DH_CORE50_HOME_ID | default('serzhan-home', true) | trim }}"
  tasks:
    - name: Refuse a HOME runner or an unexpected PVE
      ansible.builtin.assert:
        that:
          - core50_site == 'dh-core'
          - core50_profile == 'core'
          - pve.ipv4 == '192.168.11.240'
          - pve.node | length > 0
          - core50_home_id is match('^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]$')
          - core50_home_id != 'dh-core'
          - core50_action in ['audit', 'prepare', 'verify', 'maintenance']
        fail_msg: CORE50_MUST_RUN_FROM_DH_CORE_SEMAPHORE

    - name: Assert canonical CORE bootstrap profile and guest ID mapping
      ansible.builtin.include_tasks: ../tasks/core-resource-standard-assert.yml

    - name: Register only the pinned CORE PVE
      ansible.builtin.add_host:
        name: core50_pve
        groups: core50_pve_group
        ansible_host: "{{ pve.ipv4 }}"
        ansible_user: root
        ansible_connection: ssh
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: /var/lib/semaphore/.ssh/id_ed25519
        ansible_ssh_common_args: >-
          -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile=/var/lib/semaphore/.ssh/known_hosts
        core50_expected_node: "{{ pve.node }}"
        core50_action: "{{ core50_action }}"
        core50_home_id: "{{ core50_home_id }}"
      changed_when: false

- name: "50 | Audit central PBS backup configuration"
  hosts: core50_pve_group
  gather_facts: false
  tasks:
    - name: Confirm the actual CORE PVE identity
      ansible.builtin.command:
        argv: [hostname, -s]
      register: core50_hostname
      changed_when: false

    - name: Require the pinned CORE PVE identity
      ansible.builtin.assert:
        that: core50_hostname.stdout | trim == core50_expected_node
        fail_msg: CORE50_PINNED_PVE_IDENTITY_MISMATCH

    - name: Check central Media/PBS VM2243 is running
      ansible.builtin.command:
        argv: [qm, status, '2243']
      register: core50_vm_status
      changed_when: false

    - name: Require the existing CORE PBS guest
      ansible.builtin.assert:
        that: "core50_vm_status.stdout | trim == 'status: running'"
        fail_msg: CORE50_PBS_VM2243_NOT_RUNNING

    - name: Query central PBS datastores and legacy pull configuration without changes
      ansible.builtin.command:
        argv: "{{ ['qm', 'guest', 'exec', '2243', '--', 'proxmox-backup-manager'] + item.argv + ['--output-format', 'json'] }}"
      loop:
        - {label: datastore, argv: [datastore, list]}
        - {label: remote, argv: [remote, list]}
        - {label: pull_sync, argv: [sync-job, list]}
      loop_control:
        label: "{{ item.label }}"
      register: core50_queries
      changed_when: false
      no_log: true

    - name: Require complete successful responses from the trusted PBS guest
      ansible.builtin.assert:
        that:
          - (item.stdout | from_json).exitcode | int == 0
          - not ((item.stdout | from_json)['out-truncated'] | default(false) | bool)
          - ((item.stdout | from_json)['out-data'] | trim).startswith('[')
        fail_msg: CORE50_PBS_AUDIT_COMMAND_FAILED
      loop: "{{ core50_queries.results }}"
      loop_control:
        label: "{{ item.item.label }}"
      no_log: true

    - name: Parse native PBS inventories
      ansible.builtin.set_fact:
        core50_datastores: "{{ ((core50_queries.results[0].stdout | from_json)['out-data'] | trim) | from_json }}"
        core50_remotes: "{{ ((core50_queries.results[1].stdout | from_json)['out-data'] | trim) | from_json }}"
        core50_sync_jobs: "{{ ((core50_queries.results[2].stdout | from_json)['out-data'] | trim) | from_json }}"
      no_log: true

    - name: Verify the dedicated central datastore was not replaced
      ansible.builtin.assert:
        that:
          - (core50_datastores | selectattr('name', 'equalto', 'pbs-core') | list | length) == 1
          - (core50_datastores | selectattr('name', 'equalto', 'pbs-core') | first).path == '/serzhan-pool/pbs-core'
        fail_msg: CORE50_CENTRAL_DATASTORE_MISSING_OR_CHANGED

    - name: Audit freshness of all HOME namespaces
      ansible.builtin.include_tasks: ../tasks/core50-home-audit.yml
      when: core50_action == 'audit'

    - name: Prepare CORE receiving side of selected HOME Push/Restore
      ansible.builtin.include_tasks: ../tasks/core50-home-prepare.yml
      when: core50_action == 'prepare'

    - name: Verify only received snapshots from selected HOME on CORE PBS
      ansible.builtin.include_tasks: ../tasks/core50-home-verify.yml
      when: core50_action == 'verify'

    - name: Configure native namespace-only Verify and disabled Prune for prepared HOME
      ansible.builtin.include_tasks: ../tasks/core50-home-maintenance.yml
      when: core50_action in ['prepare', 'maintenance']

    - name: Report read-only backup configuration status
      ansible.builtin.debug:
        msg:
          - "CORE50_MODE={{ core50_action | upper }}"
          - CORE50_PBS=dh-core/VM2243/192.168.11.243
          - CORE50_DATASTORE=pbs-core
          - "CORE50_LEGACY_REMOTE_COUNT={{ core50_remotes | length }}"
          - "CORE50_LEGACY_PULL_SYNC_JOB_COUNT={{ core50_sync_jobs | length }}"
          - "CORE50_HOME_ID={{ core50_home_id }}"
          - CORE50_TARGET_MODEL=HOME_PUSH_TO_CORE_PBS_PER_HOME_NAMESPACE
          - CORE50_HOME_TO_CORE_TRANSPORT=HOME34_TAILSCALE_PUSH_CONTROLLED_BY_HOME
          - CORE50_B2=DEFERRED
          - CORE50_BACKUP_E2E=CHECK_FRESH_SNAPSHOTS_AND_NATIVE_TASK_HISTORY
          - CORE50_PRUNE=DISABLED_BY_DEFAULT_NO_SNAPSHOT_DELETION
