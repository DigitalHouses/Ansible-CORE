---
# CORE40: Connect registered Cloudflare device only in posture-only mode.
# No private-network tunneling here. Preserve physical routes and PBS availability.
- name: Inspect effective Cloudflare client mode and organization
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, warp-cli, --accept-tos, settings]
  register: core40_posture_settings
  changed_when: false
  no_log: true

- name: Refuse connection in any traffic-routing or DNS mode
  ansible.builtin.assert:
    that:
      - (core40_posture_settings.stdout | from_json).exitcode | int == 0
      - >-
        'Mode: PostureOnly' in
        ((core40_posture_settings.stdout | from_json)['out-data'])
      - >-
        'Organization: digitalhouses' in
        ((core40_posture_settings.stdout | from_json)['out-data'])
    fail_msg: CORE40_CF_POSTURE_ONLY_REQUIRED_BEFORE_CONNECT
  no_log: true

- name: Verify CORE Cloudflare device registration
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, warp-cli, --accept-tos, registration, show]
  register: core40_posture_registration
  changed_when: false
  no_log: true

- name: Refuse unregistered CORE Cloudflare client
  ansible.builtin.assert:
    that:
      - (core40_posture_registration.stdout | from_json).exitcode | int == 0
      - >-
        'Organization: digitalhouses' in
        ((core40_posture_registration.stdout | from_json)['out-data'])
    fail_msg: CORE40_CF_REGISTRATION_REQUIRED
  no_log: true

- name: Capture HOME route before connection
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, ip, -4, route, get, '192.168.11.223']
  register: core40_posture_home_before
  changed_when: false

- name: Capture Internet route before connection
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, ip, -4, route, get, '1.1.1.1']
  register: core40_posture_internet_before
  changed_when: false

- name: Capture DNS file hash before connection
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, sha256sum, /etc/resolv.conf]
  register: core40_posture_dns_before
  changed_when: false

- name: Require known routes before starting Cloudflare
  ansible.builtin.assert:
    that:
      - (core40_posture_home_before.stdout | from_json).exitcode | int == 0
      - (core40_posture_internet_before.stdout | from_json).exitcode | int == 0
      - (core40_posture_dns_before.stdout | from_json).exitcode | int == 0
      - "' dev eth0 ' in (' ' ~ (core40_posture_home_before.stdout | from_json)['out-data'] ~ ' ')"
      - "' dev eth0 ' in (' ' ~ (core40_posture_internet_before.stdout | from_json)['out-data'] ~ ' ')"
    fail_msg: CORE40_CF_NETWORK_PRECHECK_FAILED

- name: Read existing Cloudflare connection status
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, warp-cli, --accept-tos, status]
  register: core40_posture_status_before
  changed_when: false
  no_log: true

- name: Connect registered Cloudflare One Client in posture-only mode
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --timeout, '90', --, warp-cli, --accept-tos, connect]
  register: core40_posture_connect
  changed_when: true
  failed_when: >-
    core40_posture_connect.rc != 0 or
    ((core40_posture_connect.stdout | from_json).get('exitcode', 1) | int != 0)
  when: >-
    (core40_posture_status_before.stdout | from_json).exitcode | int != 0 or
    'Status update: Connected' not in
    ((core40_posture_status_before.stdout | from_json).get('out-data', ''))
  no_log: true

- name: Wait for Cloudflare posture connection
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --timeout, '45', --, warp-cli, --accept-tos, status]
  register: core40_posture_status_after
  changed_when: false
  failed_when: false
  retries: 8
  delay: 4
  until: >-
    core40_posture_status_after.rc == 0
    and (core40_posture_status_after.stdout | from_json).get('exitcode', 1) == 0
    and 'Status update: Connected' in
        ((core40_posture_status_after.stdout | from_json).get('out-data', ''))
  no_log: true

- name: Capture HOME route after connection
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, ip, -4, route, get, '192.168.11.223']
  register: core40_posture_home_after
  changed_when: false

- name: Capture Internet route after connection
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, ip, -4, route, get, '1.1.1.1']
  register: core40_posture_internet_after
  changed_when: false

- name: Capture DNS file hash after connection
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, sha256sum, /etc/resolv.conf]
  register: core40_posture_dns_after
  changed_when: false

- name: Ensure PBS proxy remains active
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, systemctl, is-active, proxmox-backup-proxy]
  register: core40_posture_pbs
  changed_when: false

- name: Verify posture-only activation did not alter networking or PBS
  ansible.builtin.assert:
    that:
      - (core40_posture_status_after.stdout | from_json).exitcode | int == 0
      - "'Status update: Connected' in (core40_posture_status_after.stdout | from_json)['out-data']"
      - >-
        (core40_posture_home_after.stdout | from_json)['out-data'] ==
        (core40_posture_home_before.stdout | from_json)['out-data']
      - >-
        (core40_posture_internet_after.stdout | from_json)['out-data'] ==
        (core40_posture_internet_before.stdout | from_json)['out-data']
      - >-
        (core40_posture_dns_after.stdout | from_json)['out-data'] ==
        (core40_posture_dns_before.stdout | from_json)['out-data']
      - (core40_posture_pbs.stdout | from_json).exitcode | int == 0
      - (core40_posture_pbs.stdout | from_json)['out-data'] | trim == 'active'
    fail_msg: CORE40_CF_POSTURE_CONNECTION_UNHEALTHY
  no_log: true

- name: Report established posture-only Cloudflare connection
  ansible.builtin.debug:
    msg:
      - CORE40_CF_POSTURE_CONNECTION=CONNECTED
      - CORE40_CF_SERVICE_MODE=POSTURE_ONLY
      - CORE40_CF_NETWORK_ROUTES=UNCHANGED
      - CORE40_CF_DNS=UNCHANGED
      - CORE40_CF_PBS_PROXY=ACTIVE
      - CORE40_CF_PRIVATE_NETWORK_TUNNEL=NOT_YET_CONFIGURED
