---
# CORE VM2243 one-source IP enforcement across PVE and the guest's NoCloud cache.
# This is NOT a cloud-init clean or instance-ID change and never restarts network.
- name: Read generated CORE VM cloud-init network configuration on PVE
  ansible.builtin.command:
    argv: [qm, cloudinit, dump, '2243', network]
  register: core30_pve_cloud_network
  changed_when: false

- name: Require PVE-generated NoCloud network agrees with the VM IP parameter
  ansible.builtin.assert:
    that:
      - core_media_ipv4 in core30_pve_cloud_network.stdout
      - >-
        (core30_pve_cloud_network.stdout
         | regex_findall('address:[ ]*[\x27]([0-9.]+)[\x27]')) | first
        == core_media_ipv4
    fail_msg: CORE_MEDIA30_PVE_CLOUDINIT_IP_DRIFT

- name: Read the active guest netplan generated by cloud-init
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, cat, /etc/netplan/50-cloud-init.yaml]
  register: core30_guest_netplan
  changed_when: false
  failed_when: >-
    core30_guest_netplan.rc != 0 or
    (core30_guest_netplan.stdout | from_json).exitcode | int != 0

- name: Confirm active guest netplan uses the declared VM address
  ansible.builtin.assert:
    that:
      - >-
        (core_media_ipv4 ~ '/24') in
        (core30_guest_netplan.stdout | from_json)['out-data']
    fail_msg: CORE_MEDIA30_NETPLAN_IP_DRIFT

- name: Read retained NoCloud instance network cache without changing it
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, cat, /var/lib/cloud/instance/network-config.json]
  register: core30_cloud_cache_before
  changed_when: false
  failed_when: >-
    core30_cloud_cache_before.rc != 0 or
    (core30_cloud_cache_before.stdout | from_json).exitcode | int != 0 or
    ((core30_cloud_cache_before.stdout | from_json)['out-truncated'] | default(false) | bool)

- name: Parse retained cloud-init IPv4 cache as structured JSON
  ansible.builtin.set_fact:
    core30_cloud_cache_document: >-
      {{ (core30_cloud_cache_before.stdout | from_json)['out-data'] | from_json }}

- name: Require exact expected NoCloud network layout before cache maintenance
  ansible.builtin.assert:
    that:
      - core30_cloud_cache_document.version | int == 1
      - core30_cloud_cache_document.config | length == 2
      - core30_cloud_cache_document.config[0].type == 'physical'
      - core30_cloud_cache_document.config[0].subnets | length == 1
      - core30_cloud_cache_document.config[0].subnets[0].type == 'static'
      - >-
        core30_cloud_cache_document.config[0].subnets[0].address.split('.')[:3]
        == core_media_ipv4.split('.')[:3]
    fail_msg: CORE_MEDIA30_UNEXPECTED_CLOUDINIT_CACHE

- name: Derive previous cached IP only from the observed NoCloud config
  ansible.builtin.set_fact:
    core30_cloud_cached_ipv4: "{{ core30_cloud_cache_document.config[0].subnets[0].address }}"

- name: Replace only the cached static host IP with the VM's actual IP parameter
  ansible.builtin.command:
    argv:
      - qm
      - guest
      - exec
      - '2243'
      - --
      - sed
      - -i
      - "s|\"address\": \"{{ core30_cloud_cached_ipv4 | regex_escape }}\"|\"address\": \"{{ core_media_ipv4 }}\"|"
      - /var/lib/cloud/instance/network-config.json
  register: core30_cloud_cache_repaired
  changed_when: true
  failed_when: >-
    core30_cloud_cache_repaired.rc != 0 or
    (core30_cloud_cache_repaired.stdout | from_json).exitcode | int != 0
  when:
    - core_media_action == 'repair-portal'
    - core30_cloud_cached_ipv4 != core_media_ipv4

- name: Read cached NoCloud address again after possible update
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, cat, /var/lib/cloud/instance/network-config.json]
  register: core30_cloud_cache_after
  changed_when: false

- name: Require cached static IP now matches the guest and PVE network settings
  ansible.builtin.assert:
    that:
      - core30_cloud_cache_after.rc == 0
      - (core30_cloud_cache_after.stdout | from_json).exitcode | int == 0
      - >-
        (((core30_cloud_cache_after.stdout | from_json)['out-data'] | from_json)
         .config[0].subnets[0].address) == core_media_ipv4
    fail_msg: CORE_MEDIA30_CLOUDINIT_CACHE_STALE_IP
