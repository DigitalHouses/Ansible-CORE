---
# Create or reuse only the telemetry DNS record for the dedicated dh-core tunnel.
- name: Require the dedicated tunnel and an available or already owned DNS record
  ansible.builtin.assert:
    that:
      - core60_cf_tunnels.json.result | length == 1
      - core60_cf_tunnels.json.result[0].name == 'dh-core'
      - core60_cf_dns.json.result | length <= 1
      - >-
        core60_cf_dns.json.result | length == 0 or
        (core60_cf_dns.json.result[0].type == 'CNAME' and
         core60_cf_dns.json.result[0].content == core60_cf_tunnels.json.result[0].id ~ '.cfargotunnel.com')
    fail_msg: CORE60_CF_TELEMETRY_DNS_NOT_OWNED_OR_AMBIGUOUS

- name: Set the canonical tunnel target
  ansible.builtin.set_fact:
    core60_tunnel_id: "{{ core60_cf_tunnels.json.result[0].id }}"
    core60_new_cname: "{{ core60_cf_tunnels.json.result[0].id }}.cfargotunnel.com"

- name: Verify the connector is healthy before publishing
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/accounts/{{ core60_cf_account_id }}/cfd_tunnel/{{ core60_tunnel_id }}"
    headers:
      Authorization: "Bearer {{ DH_CLOUDFLARE_API_TOKEN }}"
    method: GET
    use_proxy: false
    return_content: true
  register: core60_cf_tunnel_state
  until: core60_cf_tunnel_state.json.result.status | default('') == 'healthy'
  retries: 6
  delay: 3
  no_log: true
  changed_when: false

- name: Read current tunnel ingress
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/accounts/{{ core60_cf_account_id }}/cfd_tunnel/{{ core60_tunnel_id }}/configurations"
    headers:
      Authorization: "Bearer {{ DH_CLOUDFLARE_API_TOKEN }}"
    method: GET
    use_proxy: false
    return_content: true
    status_code: [200, 404]
  register: core60_cf_current_ingress
  no_log: true
  changed_when: false

- name: Refuse overwriting unrelated ingress
  ansible.builtin.assert:
    that:
      - >-
        (core60_cf_current_ingress.json.result.config.ingress | default([])
         | selectattr('hostname', 'defined')
         | rejectattr('hostname', 'equalto', 'telemetry.digitalhouses.vip') | list | length) == 0
    fail_msg: CORE60_DH_CORE_UNRELATED_INGRESS_PRESENT

- name: Configure protected LAN origin and public fallback
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/accounts/{{ core60_cf_account_id }}/cfd_tunnel/{{ core60_tunnel_id }}/configurations"
    headers:
      Authorization: "Bearer {{ DH_CLOUDFLARE_API_TOKEN }}"
    method: PUT
    body_format: json
    body:
      config:
        ingress:
          - hostname: telemetry.digitalhouses.vip
            service: http://192.168.11.245:8082
            originRequest: {}
          - service: 'http_status:404'
    status_code: [200, 201]
    use_proxy: false
  register: core60_cf_ingress_update
  no_log: true
  failed_when: not (core60_cf_ingress_update.json.success | default(false) | bool)

- name: Create the missing telemetry CNAME
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ core60_cf_zone_id }}/dns_records"
    headers:
      Authorization: "Bearer {{ DH_CLOUDFLARE_API_TOKEN }}"
    method: POST
    body_format: json
    body:
      type: CNAME
      name: telemetry.digitalhouses.vip
      content: "{{ core60_new_cname }}"
      proxied: true
      ttl: 1
    status_code: [200, 201]
    use_proxy: false
  register: core60_cf_dns_created
  failed_when: not (core60_cf_dns_created.json.success | default(false) | bool)
  when: core60_cf_dns.json.result | length == 0
  no_log: true

- name: Enable proxy on existing owned CNAME if necessary
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ core60_cf_zone_id }}/dns_records/{{ core60_cf_dns.json.result[0].id }}"
    headers:
      Authorization: "Bearer {{ DH_CLOUDFLARE_API_TOKEN }}"
    method: PATCH
    body_format: json
    body:
      proxied: true
      ttl: 1
    status_code: 200
    use_proxy: false
  register: core60_cf_dns_updated
  failed_when: not (core60_cf_dns_updated.json.success | default(false) | bool)
  when:
    - core60_cf_dns.json.result | length == 1
    - not (core60_cf_dns.json.result[0].proxied | bool)
  no_log: true
