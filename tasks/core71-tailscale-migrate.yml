---
# One-time CORE PBS migration: stop WARP, join existing tailnet; retain
# WARP package for rollback. Uses PVE QEMU Guest Agent, no extra SSH service.
- name: Require installed Tailscale and active legacy WARP before PBS migration
  ansible.builtin.assert:
    that:
      - (core71_pbs_package_before.stdout | from_json).exitcode | int == 0
      - (core71_pbs_warp.stdout | from_json).exitcode | int == 0
      - (core71_pbs_route_before.stdout | from_json).exitcode | int == 0
      - (core71_pbs_dns_before.stdout | from_json).exitcode | int == 0
    fail_msg: CORE71_PBS_MIGRATE_PREFLIGHT_FAILED

- name: Migrate CORE PBS from WARP to Tailscale with rollback
  block:
    - name: Disable WARP service but keep installed package for rollback
      ansible.builtin.command:
        argv: [qm, guest, exec, '2243', --, systemctl, disable, --now, warp-svc]
      register: core71_migrate_warp_stop
      failed_when: >-
        core71_migrate_warp_stop.rc != 0 or
        (core71_migrate_warp_stop.stdout | default('{}', true) | from_json).get('exitcode', 1) | int != 0
      changed_when: true

    - name: Check WARP service stopped before joining tailnet
      ansible.builtin.command:
        argv: [qm, guest, exec, '2243', --, systemctl, is-active, warp-svc]
      register: core71_migrate_warp_stopped
      changed_when: false

    - name: Refuse concurrent running WARP and Tailscale
      ansible.builtin.assert:
        that: (core71_migrate_warp_stopped.stdout | from_json).exitcode | int != 0
        fail_msg: CORE71_MIGRATE_WARP_STILL_ACTIVE

    - name: Store Tailscale auth key via QEMU Guest Agent stdin
      ansible.builtin.command:
        argv:
          - qm
          - guest
          - exec
          - '2243'
          - --pass-stdin
          - '1'
          - --
          - sh
          - -c
          - 'umask 077; cat > /run/dh-core71-tailscale-auth-key'
        stdin: "{{ core71_auth_key }}"
        stdin_add_newline: false
      register: core71_migrate_key_upload
      failed_when: >-
        core71_migrate_key_upload.rc != 0 or
        (core71_migrate_key_upload.stdout | default('{}', true) | from_json).get('exitcode', 1) | int != 0
      changed_when: false
      no_log: true

    - name: Join existing tailnet with fixed CORE PBS device name
      ansible.builtin.command:
        argv:
          - qm
          - guest
          - exec
          - '2243'
          - --timeout
          - '0'
          - --
          - tailscale
          - up
          - --auth-key=file:/run/dh-core71-tailscale-auth-key
          - --hostname=dh-core-pbs
          - --accept-dns=false
          - --accept-routes=false
          - --exit-node=
          - --advertise-exit-node=false
          - --advertise-routes=
      register: core71_migrate_join
      failed_when: >-
        core71_migrate_join.rc != 0 or
        (core71_migrate_join.stdout | default('{}', true) | from_json).get('exitcode', 1) | int != 0
      no_log: true

    - name: Disable built-in Tailscale updates and keep DNS/routing unchanged
      ansible.builtin.command:
        argv:
          - qm
          - guest
          - exec
          - '2243'
          - --
          - tailscale
          - set
          - --accept-dns=false
          - --accept-routes=false
          - --exit-node=
          - --advertise-routes=
          - --advertise-exit-node=false
          - --auto-update=false
      register: core71_migrate_preferences
      failed_when: >-
        core71_migrate_preferences.rc != 0 or
        (core71_migrate_preferences.stdout | default('{}', true) | from_json).get('exitcode', 1) | int != 0
      changed_when: false

    - name: Read CORE PBS registered tailnet status
      ansible.builtin.command:
        argv: [qm, guest, exec, '2243', --, tailscale, status, --json]
      register: core71_migrate_status
      changed_when: false

    - name: Require correct connected CORE PBS Tailscale identity
      ansible.builtin.assert:
        that:
          - (core71_migrate_status.stdout | from_json).exitcode | int == 0
          - ((core71_migrate_status.stdout | from_json)['out-data'] | from_json).BackendState == 'Running'
          - ((core71_migrate_status.stdout | from_json)['out-data'] | from_json).Self.HostName == 'dh-core-pbs'
          - ((core71_migrate_status.stdout | from_json)['out-data'] | from_json).Self.TailscaleIPs | select('match', '^100\\.') | list | length == 1
        fail_msg: CORE71_MIGRATE_TAILNET_NOT_CONNECTED

    - name: Validate Tailscale route from PBS to CORE PVE
      ansible.builtin.command:
        argv: [qm, guest, exec, '2243', --, ip, -4, route, get, '100.64.243.13']
      register: core71_migrate_pve_route
      changed_when: false

    - name: Require genuine Tailscale interface route for PBS to PVE
      ansible.builtin.assert:
        that:
          - (core71_migrate_pve_route.stdout | from_json).exitcode | int == 0
          - "'dev tailscale0' in (core71_migrate_pve_route.stdout | from_json)['out-data']"
        fail_msg: CORE71_MIGRATE_WRONG_PVE_ROUTE

    - name: Verify CORE PBS reaches CORE PVE over Tailnet
      ansible.builtin.command:
        argv: [qm, guest, exec, '2243', --timeout, '18', --, tailscale, ping, -c, '1', --timeout, 5s, '100.64.243.13']
      register: core71_migrate_ping
      changed_when: false
      failed_when: >-
        core71_migrate_ping.rc != 0 or
        (core71_migrate_ping.stdout | default('{}', true) | from_json).get('exitcode', 1) | int != 0

    - name: Recheck CORE PBS default route after migration
      ansible.builtin.command:
        argv: [qm, guest, exec, '2243', --, ip, -4, route, get, '1.1.1.1']
      register: core71_migrate_route_after
      changed_when: false

    - name: Recheck CORE PBS local DNS after migration
      ansible.builtin.command:
        argv: [qm, guest, exec, '2243', --, resolvectl, dns, eth0]
      register: core71_migrate_dns_eth0
      changed_when: false

    - name: Require local router remains DNS and gateway
      ansible.builtin.assert:
        that:
          - (core71_migrate_route_after.stdout | from_json)['out-data'] == (core71_pbs_route_before.stdout | from_json)['out-data']
          - "'192.168.11.1' in (core71_migrate_dns_eth0.stdout | from_json)['out-data']"
        fail_msg: CORE71_MIGRATE_LOCAL_NETWORK_CHANGED

  rescue:
    - name: Leave Tailscale offline after unsuccessful migration
      ansible.builtin.command:
        argv: [qm, guest, exec, '2243', --, tailscale, down]
      failed_when: false
      changed_when: false

    - name: Restore original WARP service after unsuccessful migration
      ansible.builtin.command:
        argv: [qm, guest, exec, '2243', --, systemctl, enable, --now, warp-svc]
      register: core71_migrate_warp_restore
      failed_when: false
      changed_when: false

    - name: Announce migration failure and WARP restoration attempt
      ansible.builtin.fail:
        msg: CORE71_MIGRATION_FAILED_WARP_REENABLE_ATTEMPTED_VERIFY_WARP_CONNECTIVITY

  always:
    - name: Delete temporary CORE PBS Tailscale auth key
      ansible.builtin.command:
        argv: [qm, guest, exec, '2243', --, rm, -f, /run/dh-core71-tailscale-auth-key]
      no_log: true
      failed_when: false
      changed_when: false
