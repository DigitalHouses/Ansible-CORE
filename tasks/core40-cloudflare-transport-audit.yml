---
# CORE40: read-only transport readiness. Never confuse same-LAN reachability with Cloudflare.
- name: Select exact HOME private route from Cloudflare
  ansible.builtin.set_fact:
    core40_transport_home_routes: >-
      {{ core40_cf_queries.results[0].json.result | default([])
         | selectattr('network', 'equalto', '192.168.11.223/32') | list }}
    core40_transport_profiles: >-
      {{ core40_cf_queries.results[4].json.result | default([])
         | selectattr('name','defined')
         | selectattr('name','equalto','dh-core-pbs-private') | list }}
    core40_transport_expected_match: >-
      identity.service_token_uuid == "{{ core40_cf_policy_token_rules[0].service_token.token_id }}"
  no_log: true

- name: Check exact HOME tunnel route and isolated CORE profile
  ansible.builtin.assert:
    that:
      - core40_transport_home_routes | length == 1
      - core40_transport_home_routes[0].id == 'eebd7ec3-e1dd-46eb-95e7-9f6a85f16905'
      - core40_transport_home_routes[0].tunnel_id == '6a04d9cd-0b17-48f3-8366-9f86ea08cb24'
      - core40_transport_profiles | length == 1
      - core40_transport_profiles[0].match == core40_transport_expected_match
      - core40_transport_profiles[0].enabled | bool == false
      - core40_transport_profiles[0].policy_id is match('^[0-9a-fA-F-]{36}$')
    fail_msg: CORE40_CF_ROUTE_OR_ISOLATED_PROFILE_NOT_MATCHING_HOME_70
  no_log: true

- name: Read back only CORE WARP profile and exact Include list
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/accounts/{{ core40_cf_account_id }}/devices/policy/{{ core40_transport_profiles[0].policy_id }}/include"
    method: GET
    headers:
      Authorization: "Bearer {{ DH_CLOUDFLARE_API_TOKEN }}"
    status_code: 200
    timeout: 12
    use_proxy: false
  register: core40_transport_include_raw
  changed_when: false
  no_log: true

- name: Require exactly one Cloudflare WARP Include destination
  ansible.builtin.assert:
    that:
      - core40_transport_include_raw.json.success | default(false)
      - core40_transport_include_raw.json.result | length == 1
      - core40_transport_include_raw.json.result[0].address == '192.168.11.223/32'
    fail_msg: CORE40_CF_INCLUDE_PROFILE_NOT_EXACT_HOME_PBS_32
  no_log: true

- name: Inspect CORE PBS current route through its PVE guest agent
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, ip, -4, route, get, '192.168.11.223']
  delegate_to: core40_pve
  register: core40_transport_route_before
  changed_when: false

- name: Inspect CORE PBS WARP status without revealing credentials
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, warp-cli, --accept-tos, status]
  delegate_to: core40_pve
  register: core40_transport_warp_before
  changed_when: false
  no_log: true

- name: Inspect CORE PBS effective mode
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, warp-cli, --accept-tos, settings]
  delegate_to: core40_pve
  register: core40_transport_settings_before
  changed_when: false
  no_log: true

- name: Inspect CORE PBS proxy service
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, systemctl, is-active, proxmox-backup-proxy]
  delegate_to: core40_pve
  register: core40_transport_pbs_before
  changed_when: false

- name: Require current CORE route and PBS remain safe
  ansible.builtin.assert:
    that:
      - (core40_transport_route_before.stdout | from_json).exitcode | int == 0
      - >-
        ' dev eth0 ' in (' ' ~
        ((core40_transport_route_before.stdout | from_json)['out-data'] | trim) ~ ' ')
      - (core40_transport_warp_before.stdout | from_json).exitcode | int == 0
      - >-
        'Disconnected' in ((core40_transport_warp_before.stdout | from_json)['out-data'])
      - (core40_transport_settings_before.stdout | from_json).exitcode | int == 0
      - >-
        'Mode: PostureOnly' in ((core40_transport_settings_before.stdout | from_json)['out-data'])
      - (core40_transport_pbs_before.stdout | from_json).exitcode | int == 0
      - ((core40_transport_pbs_before.stdout | from_json)['out-data'] | trim) == 'active'
    fail_msg: CORE40_CF_CORE_GUEST_PRECHECK_UNEXPECTED
  no_log: true

- name: Report only nonsecret CORE to HOME Cloudflare readiness
  ansible.builtin.debug:
    msg:
      - CORE40_CF_HOME_PRIVATE_ROUTE=EXACT_UUID_AND_TUNNEL_VERIFIED
      - CORE40_CF_CORE_PROFILE=EXACT_INACTIVE_MATCH_VERIFIED
      - CORE40_CF_SPLIT_TUNNEL=INCLUDE_ONLY_HOME_PBS_32
      - CORE40_CF_GUEST_MODE=POSTURE_ONLY_DISCONNECTED
      - CORE40_CF_MANAGEMENT_ROUTE=UNALTERED
      - CORE40_CF_PBS_PROXY=ACTIVE
      - CORE40_CF_END_TO_END=NOT_YET_ATTEMPTED
