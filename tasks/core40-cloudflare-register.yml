---
# CORE40: Register the central PBS VM in Cloudflare One in POSTURE-ONLY mode.
# No default-route, DNS, or HOME traffic takeover. Traffic mode is a separate step.
# Credentials come exclusively from Semaphore task 05 (never from survey or Git).
- name: Require explicit Cloudflare Terms of Service acceptance
  ansible.builtin.assert:
    that:
      - core40_cf_accept_tos | default('no') == 'yes'
    fail_msg: CORE40_CF_TOS_ACCEPTANCE_REQUIRED_IN_SURVEY

- name: Require CORE Zero Trust credentials from shared task 05
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'DH_CLOUDFLARE_TEAM_NAME') == 'digitalhouses'
      - (DH_CLOUDFLARE_ENROLL_CLIENT_ID | default('')) | length > 0
      - (DH_CLOUDFLARE_ENROLL_CLIENT_SECRET | default('')) | length > 0
    fail_msg: CORE40_CF_ENROLLMENT_CREDENTIALS_MISSING_FROM_05
  no_log: true

- name: Build official headless MDM XML exclusively in Ansible memory
  ansible.builtin.set_fact:
    core40_cf_mdm_xml: |
      <dict>
        <key>auth_client_id</key>
        <string>{{ DH_CLOUDFLARE_ENROLL_CLIENT_ID | e }}</string>
        <key>auth_client_secret</key>
        <string>{{ DH_CLOUDFLARE_ENROLL_CLIENT_SECRET | e }}</string>
        <key>auto_connect</key>
        <integer>0</integer>
        <key>onboarding</key>
        <false/>
        <key>organization</key>
        <string>{{ lookup('ansible.builtin.env', 'DH_CLOUDFLARE_TEAM_NAME') | e }}</string>
        <key>service_mode</key>
        <string>postureonly</string>
      </dict>
  no_log: true

- name: Require pre-installed Cloudflare One Client package
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, dpkg-query, -W, cloudflare-warp]
  register: core40_cf_reg_package
  changed_when: false

- name: Reject enrollment if official client is not installed
  ansible.builtin.assert:
    that: (core40_cf_reg_package.stdout | from_json).exitcode | int == 0
    fail_msg: CORE40_CF_INSTALL_PACKAGE_BEFORE_REGISTRATION

- name: Confirm original HOME PBS route via physical interface
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, ip, -4, route, get, '192.168.11.223']
  register: core40_cf_reg_route_before
  changed_when: false

- name: Confirm original Internet route via physical interface
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, ip, -4, route, get, '1.1.1.1']
  register: core40_cf_reg_internet_before
  changed_when: false

- name: Require known safe physical routes before enrollment
  ansible.builtin.assert:
    that:
      - (core40_cf_reg_route_before.stdout | from_json).exitcode | int == 0
      - >-
        ' dev eth0 ' in (' ' ~
        ((core40_cf_reg_route_before.stdout | from_json)['out-data'] | trim) ~ ' ')
      - (core40_cf_reg_internet_before.stdout | from_json).exitcode | int == 0
      - >-
        ' dev eth0 ' in (' ' ~
        ((core40_cf_reg_internet_before.stdout | from_json)['out-data'] | trim) ~ ' ')
    fail_msg: CORE40_CF_UNEXPECTED_NETWORK_BEFORE_ENROLLMENT

- name: Check for existing managed Cloudflare deployment file
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, test, -f, /var/lib/cloudflare-warp/mdm.xml]
  register: core40_cf_reg_mdm_exists
  changed_when: false

- name: Require normal MDM file state
  ansible.builtin.assert:
    that: (core40_cf_reg_mdm_exists.stdout | from_json).exitcode | int in [0, 1]
    fail_msg: CORE40_CF_MDM_INSPECTION_FAILED

- name: Compare existing MDM file hash without reading stored secrets
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, sha256sum, /var/lib/cloudflare-warp/mdm.xml]
  register: core40_cf_reg_existing_digest
  changed_when: false
  when: (core40_cf_reg_mdm_exists.stdout | from_json).exitcode | int == 0
  no_log: true

- name: Refuse unexpected existing MDM credentials without overwriting them
  ansible.builtin.assert:
    that:
      - >-
        (core40_cf_reg_mdm_exists.stdout | from_json).exitcode | int == 1
        or ((core40_cf_reg_existing_digest.stdout | from_json)['out-data'].split()[0]
            == (core40_cf_mdm_xml | hash('sha256')))
    fail_msg: CORE40_CF_DIFFERENT_MDM_ALREADY_EXISTS_NO_AUTOMATIC_ROTATION
  no_log: true

- name: Verify root-owned Cloudflare working directory already exists
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, test, -d, /var/lib/cloudflare-warp]
  register: core40_cf_reg_workdir
  changed_when: false

- name: Require Cloudflare package created its state directory
  ansible.builtin.assert:
    that: (core40_cf_reg_workdir.stdout | from_json).exitcode | int == 0
    fail_msg: CORE40_CF_STATE_DIRECTORY_MISSING

- name: Stream sensitive MDM XML directly into the PBS guest with root-only permissions
  ansible.builtin.command:
    argv:
      - qm
      - guest
      - exec
      - '2243'
      - --pass-stdin
      - '1'
      - --timeout
      - '60'
      - --
      - /bin/sh
      - -c
      - 'umask 077; cat > /var/lib/cloudflare-warp/mdm.xml'
    stdin: "{{ core40_cf_mdm_xml }}"
    stdin_add_newline: false
  register: core40_cf_reg_mdm_write
  changed_when: true
  failed_when: (core40_cf_reg_mdm_write.stdout | from_json).exitcode | int != 0
  when: (core40_cf_reg_mdm_exists.stdout | from_json).exitcode | int == 1
  no_log: true

- name: Check file permissions without showing the file contents
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, stat, -c, '%a', /var/lib/cloudflare-warp/mdm.xml]
  register: core40_cf_reg_mdm_perm
  changed_when: false
  no_log: true

- name: Require root-only access to service token MDM file
  ansible.builtin.assert:
    that:
      - (core40_cf_reg_mdm_perm.stdout | from_json).exitcode | int == 0
      - ((core40_cf_reg_mdm_perm.stdout | from_json)['out-data'] | trim) == '600'
    fail_msg: CORE40_CF_MDM_PERMISSIONS_INVALID
  no_log: true

- name: Restart Cloudflare client to apply posture-only registration
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --timeout, '120', --, systemctl, restart, warp-svc]
  register: core40_cf_reg_restart
  changed_when: true
  failed_when: (core40_cf_reg_restart.stdout | from_json).exitcode | int != 0
  when: (core40_cf_reg_mdm_exists.stdout | from_json).exitcode | int == 1

- name: Inspect Cloudflare registration using explicit ToS acceptance
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --timeout, '60', --, warp-cli, --accept-tos, registration, show]
  register: core40_cf_reg_show
  changed_when: false
  failed_when: false
  retries: 4
  delay: 4
  until: >-
    core40_cf_reg_show.rc == 0
    and (core40_cf_reg_show.stdout | from_json).get('exitcode', 1) == 0
  no_log: true

- name: Confirm registration completed and not merely that MDM exists
  ansible.builtin.assert:
    that:
      - core40_cf_reg_show.rc == 0
      - (core40_cf_reg_show.stdout | from_json).exitcode | int == 0
      - >-
        'digitalhouses' in ((core40_cf_reg_show.stdout | from_json).get('out-data', '') | lower)
    fail_msg: CORE40_CF_REGISTRATION_NOT_CONFIRMED_CHECK_SERVICE_AUTH_POLICY
  no_log: true

- name: Inspect the actual Cloudflare client state
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --timeout, '60', --, warp-cli, --accept-tos, status]
  register: core40_cf_reg_status
  changed_when: false
  failed_when: false
  no_log: true

- name: Inspect HOME PBS route after registration
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, ip, -4, route, get, '192.168.11.223']
  register: core40_cf_reg_route_after
  changed_when: false

- name: Inspect Internet route after registration
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, ip, -4, route, get, '1.1.1.1']
  register: core40_cf_reg_internet_after
  changed_when: false

- name: Require registration did not intercept physical network routes
  ansible.builtin.assert:
    that:
      - (core40_cf_reg_route_after.stdout | from_json).exitcode | int == 0
      - (core40_cf_reg_internet_after.stdout | from_json).exitcode | int == 0
      - >-
        ' dev eth0 ' in (' ' ~
        ((core40_cf_reg_route_after.stdout | from_json)['out-data'] | trim) ~ ' ')
      - >-
        ' dev eth0 ' in (' ' ~
        ((core40_cf_reg_internet_after.stdout | from_json)['out-data'] | trim) ~ ' ')
    fail_msg: CORE40_CF_UNEXPECTED_ROUTE_CHANGE_REVIEW_BEFORE_CONNECTING

- name: Verify PBS proxy is still active after enrollment
  ansible.builtin.command:
    argv: [qm, guest, exec, '2243', --, systemctl, is-active, proxmox-backup-proxy]
  register: core40_cf_reg_pbs_status
  changed_when: false

- name: Require healthy PBS after Cloudflare enrollment
  ansible.builtin.assert:
    that:
      - (core40_cf_reg_pbs_status.stdout | from_json).exitcode | int == 0
      - ((core40_cf_reg_pbs_status.stdout | from_json)['out-data'] | trim) == 'active'
    fail_msg: CORE40_CF_PBS_PROXY_NOT_ACTIVE

- name: Report only safe posture-only enrollment metadata
  ansible.builtin.debug:
    msg:
      - CORE40_CF_MDM_MODE=POSTURE_ONLY
      - CORE40_CF_MDM_FILE=ROOT_ONLY_0600
      - CORE40_CF_MDM_SECRETS=FROM_TASK_05
      - CORE40_CF_TOS=ACCEPTED_BY_EXPLICIT_SURVEY
      - CORE40_CF_REGISTERED=CONFIRMED
      - CORE40_CF_ROUTE_HOME=UNCHANGED
      - CORE40_CF_ROUTE_INTERNET=UNCHANGED
      - CORE40_CF_PBS_PROXY=ACTIVE
      - CORE40_CF_TRAFFIC_TUNNEL=NOT_ENABLED
      - CORE40_CF_NEXT=VERIFY_HOME_PRIVATE_ROUTE_AND_SPLIT_TUNNELS
