---
# Survey decision is the authorization: import preserves data, erase replaces it.
# Import never wipes or re-creates a pool. Erase touches only one non-root SATA disk.

- name: Refuse all erase actions on CORE (import existing physical SATA data only)
  ansible.builtin.assert:
    that:
      - media_raw_disk_action == 'import'
      - media_vm.storage.pool_name == 'serzhan-pool'
    fail_msg: CORE_DISK_ERASE_NOT_SUPPORTED

- name: Check whether the selected ZFS pool is already imported
  ansible.builtin.command:
    argv: [zpool, list, -H, -o, name, "{{ media_vm.storage.pool_name }}"]
  register: media_target_pool_present
  changed_when: false
  failed_when: false

- name: Import the requested existing ZFS pool without touching disk contents
  ansible.builtin.command:
    argv: >-
      {{ ['zpool', 'import', '-f']
         + (['-o', 'readonly=on'] if media_vm.storage.mode == 'readonly' else [])
         + [media_vm.storage.pool_name] }}
  changed_when: true
  when:
    - media_raw_disk_action == 'import'
    - media_target_pool_present.rc != 0

- name: Read existing ZFS datasets
  ansible.builtin.command:
    argv: [zfs, list, -H, -o, name]
  register: media_zfs_datasets
  changed_when: false

- name: Create only absent declared datasets
  ansible.builtin.command:
    argv: [zfs, create, "{{ media_vm.storage.pool_name }}/{{ item }}"]
  loop: "{{ media_vm.storage.layout.datasets }}"
  when: >-
    (media_vm.storage.pool_name ~ '/' ~ item) not in media_zfs_datasets.stdout_lines

  changed_when: true
- name: Read dataset mount states
  ansible.builtin.command:
    argv: [zfs, get, -H, -o, value, mounted, "{{ media_vm.storage.pool_name }}/{{ item }}"]
  loop: "{{ media_vm.storage.layout.datasets }}"
  register: media_zfs_mount_states
  changed_when: false

- name: Mount declared datasets that are not already mounted
  ansible.builtin.command:
    argv: [zfs, mount, "{{ media_vm.storage.pool_name }}/{{ item.item }}"]
  loop: "{{ media_zfs_mount_states.results }}"
  when: item.stdout != 'yes'

  changed_when: true
- name: Check that directories have not been replaced by symlinks
  ansible.builtin.stat:
    path: "/{{ media_vm.storage.pool_name }}/{{ item }}"
    follow: false
  loop: "{{ media_vm.storage.layout.directories }}"
  register: media_layout_paths
  changed_when: false

- name: Reject redirected media storage directories
  ansible.builtin.assert:
    that:
      - not (item.stat.islnk | default(false))
    fail_msg: MEDIA_LAYOUT_SYMLINK_BLOCKED
  loop: "{{ media_layout_paths.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Ensure declared directories are present
  ansible.builtin.file:
    path: "/{{ media_vm.storage.pool_name }}/{{ item }}"
    state: directory
    mode: '2775'
  loop: "{{ media_vm.storage.layout.directories }}"

- name: Retire old Python-backed custom ZFS boot service when present
  ansible.builtin.stat:
    path: /etc/systemd/system/dh-media-zfs.service
  register: media_old_zfs_service

- name: Stop and disable old custom ZFS importer
  ansible.builtin.systemd_service:
    name: dh-media-zfs.service
    enabled: false
    state: stopped
  when: media_old_zfs_service.stat.exists

- name: Remove retired boot service definition
  ansible.builtin.file:
    path: /etc/systemd/system/dh-media-zfs.service
    state: absent
  when: media_old_zfs_service.stat.exists

- name: Enable native ZFS import and mount at boot
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop:
    - zfs-import-cache.service
    - zfs-mount.service

- name: Confirm requested pool is imported
  ansible.builtin.command:
    argv: [zpool, list, -H, -o, name, "{{ media_vm.storage.pool_name }}"]
  changed_when: false
