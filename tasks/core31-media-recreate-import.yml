---
# CORE-only VM2243 native Recreate+Import.
# Recreates the PVE VM from an existing verified system-disk backup;
# NOT a fresh Debian installation. Never touches physical SATA partitions/ZFS.
- name: Require exactly one previously validated VM2243 rollback archive
  ansible.builtin.assert:
    that:
      - core31_boot_archives.matched == 1
      - core31_boot_archives.files[0].path is match('^/var/lib/vz/dump/vzdump-qemu-2243-.*[.]vma[.]zst$')
      - (core31_boot_archives.files[0].size | int) > 104857600
    fail_msg: CORE31_RECREATE_REQUIRES_EXACT_VERIFIED_BACKUP

- name: Reverify native PVE archive integrity before stopping PBS
  ansible.builtin.command:
    argv: [sha256sum, -c, "{{ core31_boot_archives.files[0].path }}.sha256"]
  register: core31_recreate_archive_check
  changed_when: false
  no_log: true

- name: Require checksum of protected backup to pass
  ansible.builtin.assert:
    that:
      - core31_recreate_archive_check.rc == 0
    fail_msg: CORE31_RECREATE_ARCHIVE_CHECKSUM_FAILED

- name: Obtain existing PBS HTTPS fingerprint for post-import identity check
  ansible.builtin.command:
    argv:
      - qm
      - guest
      - exec
      - "{{ core_media_vmid | string }}"
      - --
      - openssl
      - x509
      - -in
      - /etc/proxmox-backup/proxy.pem
      - -noout
      - -fingerprint
      - -sha256
  register: core31_pbs_fingerprint_before
  changed_when: false
  when: not core31_resume_stopped

- name: Refuse missing original PBS TLS identity
  ansible.builtin.assert:
    that:
      - (core31_pbs_fingerprint_before.stdout | from_json).exitcode | int == 0
      - (core31_pbs_fingerprint_before.stdout | from_json)['out-data'] | trim | length > 40
    fail_msg: CORE31_PBS_ORIGINAL_TLS_IDENTITY_UNAVAILABLE
  when: not core31_resume_stopped

- name: Confirm guest archive is still held on preserved ZFS before cutover
  ansible.builtin.command:
    argv:
      - qm
      - guest
      - exec
      - "{{ core_media_vmid | string }}"
      - --
      - /bin/bash
      - -lc
      - |
        set -Eeuo pipefail
        cd /serzhan-pool/digitalhouses/core31-recreate
        sha256sum -c guest-state-*.tar.gz.sha256 >/dev/null
        test "$(findmnt -n -T . -o FSTYPE)" = zfs
        echo CORE31_GUEST_STATE_ARCHIVE_OK
  register: core31_guest_archive_check
  changed_when: false
  no_log: true
  when: not core31_resume_stopped

- name: Require healthy protected guest archive on retained physical disk
  ansible.builtin.assert:
    that:
      - core31_guest_archive_check.rc == 0
      - (core31_guest_archive_check.stdout | from_json).exitcode | int == 0
    fail_msg: CORE31_PRESERVED_GUEST_STATE_ARCHIVE_INVALID
  when: not core31_resume_stopped

- name: Shut down existing CORE PBS guest cleanly (no forced poweroff)
  ansible.builtin.command:
    argv: [qm, shutdown, "{{ core_media_vmid | string }}", --timeout, '180']
  register: core31_graceful_shutdown
  changed_when: true
  when: not core31_resume_stopped

- name: Verify no running VM before any deletion
  ansible.builtin.command:
    argv: [qm, status, "{{ core_media_vmid | string }}"]
  register: core31_offline_state
  changed_when: false

- name: Require confirmed clean shutdown
  ansible.builtin.assert:
    that:
      - "core31_offline_state.stdout | trim == 'status: stopped'"
      - (core31_graceful_shutdown.rc | default(0)) == 0
    fail_msg: CORE31_VM_STILL_RUNNING_ABORT_DESTROY

- name: Temporarily remove PVE deletion protection from stopped VM2243
  ansible.builtin.command:
    argv: [qm, set, "{{ core_media_vmid | string }}", --protection, '0']
  changed_when: true

- name: Delete only CORE VM2243 config and owned virtual OS/cloud-init disks
  ansible.builtin.command:
    argv:
      - qm
      - destroy
      - "{{ core_media_vmid | string }}"
      - --purge
      - '0'
      - --destroy-unreferenced-disks
      - '0'
  changed_when: true
  # PCI passthrough SATA disk is not a managed virtual disk.

- name: Recreate VM2243 from verified native PVE system backup
  ansible.builtin.command:
    argv:
      - qmrestore
      - "{{ core31_boot_archives.files[0].path }}"
      - "{{ core_media_vmid | string }}"
      - --storage
      - local-lvm
      - --unique
      - '0'
  register: core31_vm_restored
  changed_when: true
  failed_when: core31_vm_restored.rc != 0

- name: Set canonical CORE VM name without changing its guest certificates
  ansible.builtin.command:
    argv:
      - qm
      - set
      - "{{ core_media_vmid | string }}"
      - --name
      - "{{ core_resource_standard.media_vm_name }}"
      - --protection
      - '1'
      - --onboot
      - '1'
  changed_when: true

- name: Read newly created CORE VM config before running any guest
  ansible.builtin.command:
    argv: [qm, config, "{{ core_media_vmid | string }}"]
  register: core31_recreated_config
  changed_when: false

- name: Refuse loss of PCI SATA, GPU, fixed IP or boot disk during restoration
  ansible.builtin.assert:
    that:
      - >-
        ('name: ' ~ core_resource_standard.media_vm_name)
        in core31_recreated_config.stdout_lines
      - >-
        core31_recreated_config.stdout is search(
          '(?m)^hostpci0: ' ~ (core31_hardware.gpu_hostpci | regex_escape) ~ ',')
      - >-
        core31_recreated_config.stdout is search(
          '(?m)^hostpci1: ' ~ (core31_hardware.sata_hostpci | regex_escape) ~ ',')
      - >-
        core31_recreated_config.stdout is search(
          '(?m)^ipconfig0: ip=' ~ (core31_expected_media_ip | regex_escape) ~ '/24,gw=')
      - >-
        core31_recreated_config.stdout is search(
          '(?m)^scsi0: local-lvm:vm-2243-disk-0,')
      - "'protection: 1' in core31_recreated_config.stdout_lines"
    fail_msg: CORE31_RECREATED_VM_HARDWARE_MISMATCH_STOPPED

- name: Start recreated CORE VM2243 with retained PCI SATA controller
  ansible.builtin.command:
    argv: [qm, start, "{{ core_media_vmid | string }}"]
  changed_when: true

- name: Wait for restored Debian QEMU Guest Agent to respond
  ansible.builtin.command:
    argv: [qm, guest, exec, "{{ core_media_vmid | string }}", --, hostname, -I]
  register: core31_recreated_qga
  changed_when: false
  failed_when: false
  retries: 40
  delay: 5
  until: >-
    core31_recreated_qga.rc == 0 and
    (core31_recreated_qga.stdout | default('{}', true) | from_json).get('exitcode', 1) | int == 0

- name: Require original CORE LAN address in restored guest
  ansible.builtin.assert:
    that:
      - core31_recreated_qga.rc == 0
      - (core31_recreated_qga.stdout | from_json).exitcode | int == 0
      - core31_expected_media_ip in (core31_recreated_qga.stdout | from_json)['out-data'].split()
    fail_msg: CORE31_RECREATED_GUEST_IP_FAILED

- name: Read ZFS pool identity after restored guest boot
  ansible.builtin.command:
    argv:
      - qm
      - guest
      - exec
      - "{{ core_media_vmid | string }}"
      - --
      - zpool
      - list
      - -H
      - -o
      - 'name,health,guid'
  register: core31_imported_pool
  changed_when: false

- name: Require preserved physical SATA pool auto-imported with unchanged GUID
  ansible.builtin.assert:
    that:
      - (core31_imported_pool.stdout | from_json).exitcode | int == 0
      - >-
        ((core31_imported_pool.stdout | from_json)['out-data'] | trim).split()
        == [core31_hardware.pool_name, 'ONLINE', core31_hardware.pool_guid]
    fail_msg: CORE31_ZFS_IMPORT_MISSING_OR_WRONG_POOL

- name: Inspect PBS datastore registration on recreated guest
  ansible.builtin.command:
    argv: [qm, guest, exec, "{{ core_media_vmid | string }}", --, proxmox-backup-manager, datastore, list, --output-format, json]
  register: core31_imported_datastores_raw
  changed_when: false

- name: Verify two original PBS datastore names and physical ZFS paths
  ansible.builtin.assert:
    that:
      - (core31_imported_datastores_raw.stdout | from_json).exitcode | int == 0
      - >-
        (((core31_imported_datastores_raw.stdout | from_json)['out-data'] | from_json)
        | selectattr('name','equalto','pbs-core') | map(attribute='path') | list)
        == ['/serzhan-pool/pbs-core']
      - >-
        (((core31_imported_datastores_raw.stdout | from_json)['out-data'] | from_json)
        | selectattr('name','equalto','pbs-serzhan') | map(attribute='path') | list)
        == ['/serzhan-pool/pbs-serzhan']
    fail_msg: CORE31_PBS_STORES_FAILED_AFTER_IMPORT

- name: Read restored PBS HTTPS identity
  ansible.builtin.command:
    argv:
      - qm
      - guest
      - exec
      - "{{ core_media_vmid | string }}"
      - --
      - openssl
      - x509
      - -in
      - /etc/proxmox-backup/proxy.pem
      - -noout
      - -fingerprint
      - -sha256
  register: core31_pbs_fingerprint_after
  changed_when: false

- name: Require exactly the original PBS certificate fingerprint
  ansible.builtin.assert:
    that:
      - (core31_pbs_fingerprint_after.stdout | from_json).exitcode | int == 0
      - >-
        (core31_pbs_fingerprint_after.stdout | from_json)['out-data'] | trim
        == (core31_pbs_fingerprint_before.stdout | from_json)['out-data'] | trim
    fail_msg: CORE31_PBS_TLS_FINGERPRINT_CHANGED
  when: not core31_resume_stopped

- name: Require valid original PBS TLS identity also after interrupted shutdown
  ansible.builtin.assert:
    that:
      - (core31_pbs_fingerprint_after.stdout | from_json).exitcode | int == 0
      - (core31_pbs_fingerprint_after.stdout | from_json)['out-data'] | trim | length > 40
    fail_msg: CORE31_RESTORED_PBS_TLS_CERTIFICATE_INVALID
  when: core31_resume_stopped

- name: Confirm native CORE PBS API available after guest import
  ansible.builtin.uri:
    url: "https://{{ core31_expected_media_ip }}:8007/api2/json/version"
    status_code: 200
    validate_certs: false
    use_proxy: false
    timeout: 10
  register: core31_restored_api
  changed_when: false
  retries: 15
  delay: 4
  until: core31_restored_api.status | default(0) == 200

- name: Report accepted CORE-only native VM Recreate+Import
  ansible.builtin.debug:
    msg:
      - CORE31_ACTION=RECREATE_IMPORT
      - "CORE31_VM={{ core_media_vmid }}"
      - "CORE31_VM_NAME={{ core_resource_standard.media_vm_name }}"
      - "CORE31_VM_IP={{ core31_expected_media_ip }}"
      - CORE31_OS=RESTORED_FROM_VERIFIED_PVE_BACKUP_NOT_FRESH_INSTALL
      - CORE31_ZFS=EXISTING_POOL_IMPORTED_UNCHANGED
      - CORE31_PBS_DATASTORES=pbs-core,pbs-serzhan
      - CORE31_PBS_TLS_FINGERPRINT=PRESERVED
      - CORE31_PBS_API=HTTP_200
      - CORE31_VM_RECREATE_IMPORT=PASS
