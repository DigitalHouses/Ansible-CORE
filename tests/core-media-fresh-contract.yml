---
- name: Require CORE fresh OS installation from native HOME-proven blocks
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/core-media-deploy.yml
  vars:
    root: "{{ playbook_dir | dirname }}"
    clean: "{{ lookup('ansible.builtin.file', root ~ '/playbooks/core-media-fresh.yml') | from_yaml }}"
    cert_renew: "{{ lookup('ansible.builtin.file', root ~ '/playbooks/media-account-cert-renew.yml') | from_yaml }}"
    zfs: "{{ lookup('ansible.builtin.file', root ~ '/tasks/media-zfs-apply.yml') }}"
    image: "{{ lookup('ansible.builtin.file', root ~ '/tasks/media30-image-prestage.yml') }}"
    vm: "{{ lookup('ansible.builtin.file', root ~ '/tasks/media-vm-apply.yml') | from_yaml }}"
    pbs: "{{ lookup('ansible.builtin.file', root ~ '/tasks/core-media-pbs-import.yml') }}"
    recreate_gate: "{{ lookup('ansible.builtin.file', root ~ '/tasks/media30-recreate-e2e-preflight.yml') }}"
    catalog: "{{ lookup('ansible.builtin.file', root ~ '/catalog/tasks.yml') | from_yaml }}"
    pbs_identity: "{{ lookup('ansible.builtin.file', root ~ '/tasks/core-media-pbs-import.yml') | from_yaml }}"
    tailscale_tasks: "{{ lookup('ansible.builtin.file', root ~ '/tasks/core-media-tailscale-import.yml') | from_yaml }}"
    wsdd: "{{ lookup('ansible.builtin.file', root ~ '/tasks/media30-wsdd-apply.yml') | from_yaml }}"
    item31: "{{ (catalog.tasks | selectattr('name', 'equalto', '31-CORE Media/PBS — Create/Recreate + Import') | list) | first }}"
  tasks:
    - name: Pin CORE addressing, guest IDs, original SATA and ZFS
      ansible.builtin.assert:
        that:
          - core_media_site.id == 'dh-core'
          - core_media_spec.name == 'mediaserver-CORE'
          - core_media_spec.os_hostname == 'mediaserver-dh-core'
          - core_media_spec.vmid == 2243
          - core_media_spec.network.ipv4 == '192.168.11.243/24'
          - core_media_spec.storage.pool_name == 'serzhan-pool'
          - "'pbs-core' in core_media_spec.storage.layout.datasets"
          - "'pbs-serzhan' not in core_media_spec.storage.layout.datasets"
          - core_media_spec.storage.import_pool_guid == '18293847766285774524'
          - core_media_spec.pci.sata_controller == '0000:2b:00.0'
          - core_media_spec.pci.gpu == '0000:2f:00.0'
          - item31.playbook == 'playbooks/core-media-fresh.yml'
          - item31.survey_vars[0].default_value == 'update'
          - item31.survey_vars[0]['values'] | map(attribute='value') | list == ['create','update']
          - item31.survey_vars[1].default_value == 'import'
          - item31.survey_vars[1]['values'] | map(attribute='value') | list == ['import','erase']

    - name: Require fresh Debian cloud image and native VM creation, never OS archive restore
      ansible.builtin.assert:
        that:
          - "'debian-13-generic-amd64.qcow2' in image"
          - "'SHA512SUMS' in image"
          - "'qm' in (vm | to_json) and 'create' in (vm | to_json)"
          - "'os_hostname | default(media_vm.name)' in (lookup('ansible.builtin.file', root ~ '/tasks/media-vm-apply.yml'))"
          - "'importdisk' in (vm | to_json)"
          - "'media30-image-prestage.yml' in (clean | to_json)"
          - "'media-vm-apply.yml' in (clean | to_json)"
          - "'core-media-pbs-import.yml' in (clean | to_json)"
          - "'core-media-tailscale-import.yml' in (clean | to_json)"
          - "'media-native-apps.yml' in (clean | to_json)"
          - "'media30-pbs-apply.yml' in (clean | to_json)"
          - "'qmrestore' not in (clean | to_json)"
          - "'vzdump-qemu' not in (clean | to_json)"

    - name: Require Import-only ZFS implementation without formatting operations
      ansible.builtin.assert:
        that:
          - "'CORE_DISK_ERASE_NOT_SUPPORTED' in zfs"
          - "'zpool' in zfs"
          - "'import' in zfs"
          - "'wipefs' not in zfs"
          - "'sgdisk' not in zfs"
          - "'zpool, destroy' not in zfs"
          - "'etc/proxmox-backup' in pbs"
          - "'pbs-core' in pbs"
          - "'--destroy-data' in pbs"
          - "'pbs-serzhan' in pbs"
          - "'/datastore/pbs-core/dh-core' in pbs"
          - "'/pbs-core' in recreate_gate"
          - "'MEDIA30_E2E_PBS_DATASTORE=pbs-core' in recreate_gate"

    - name: Require Update to avoid disk lifecycle
      ansible.builtin.assert:
        that:
          - clean[-1].hosts == 'media_update_pve'
          - "'media-vm-apply.yml' not in (clean[-1] | to_json)"
          - "'media-zfs-apply.yml' not in (clean[-1] | to_json)"
          - "'core-media-pbs-import.yml' not in (clean[-1] | to_json)"
          - "'CORE31_ERASE_NOT_IMPLEMENTED_NO_CHANGES_MADE' in (clean | to_json)"
          - >-
            (pbs_identity | selectattr('name', 'equalto', 'Verify preserved PBS identity and credentials archive checksum') | first).args.chdir
            == '/serzhan-pool/digitalhouses/core31-recreate'

    - name: Require bounded Tailscale machine identity recovery after fresh guest boot
      ansible.builtin.assert:
        that:
          - >-
            (tailscale_tasks | selectattr('name', 'equalto', 'Verify recovered CORE tailnet is connected without re-authentication')
             | first).retries == 24
          - >-
            (tailscale_tasks | selectattr('name', 'equalto', 'Verify recovered CORE tailnet is connected without re-authentication')
             | first).delay == 5
          - "'BackendState' in (tailscale_tasks | to_json)"

    - name: Require CORE-specific Windows discovery name, not inherited HOME owner label
      ansible.builtin.assert:
        that:
          - core_media_spec.discovery.netbios_name == 'server-' ~ core_media_site.id
          - "'media_site.id' in (wsdd | to_json)"
          - "'media_site.owner_slug' not in (wsdd | to_json)"

    - name: Require native auxiliary HTTPS renewal playbook installed from CORE repository
      ansible.builtin.assert:
        that:
          - "'/etc/digitalhouses/media-account-pki/server.crt' in (cert_renew | to_json)"
          - "'ansible.builtin.systemd_service' in (cert_renew | to_json)"
          - "'media-account-cert-renew.yml' in (lookup('ansible.builtin.file', root ~ '/tasks/media30-account-portal-apply.yml'))"
