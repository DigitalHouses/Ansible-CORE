---
- name: Contract for CORE DH Stats lifecycle
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/core-resource-standard.yml
  vars:
    root: "{{ playbook_dir | dirname }}"
    audit: "{{ lookup('ansible.builtin.file', root ~ '/playbooks/core-stats.yml') | from_yaml }}"
    catalog: "{{ lookup('ansible.builtin.file', root ~ '/catalog/tasks.yml') | from_yaml }}"
    deploy_tasks: "{{ lookup('ansible.builtin.file', root ~ '/tasks/core60-deploy.yml') | from_yaml }}"
    cutover: "{{ lookup('ansible.builtin.file', root ~ '/tasks/core60-cloudflare-cutover.yml') | from_yaml }}"
    install_script: "{{ lookup('ansible.builtin.file', root ~ '/files/core60/install-stats.sh') }}"
    entry: "{{ (catalog.tasks | selectattr('name', 'equalto', '60-CORE DH Stats') | list | first) }}"
  tasks:
    - name: Verify deterministic CORE target and two lifecycle actions
      ansible.builtin.assert:
        that:
          - core_stats_ctid | int == 1245
          - core_resource_standard.stats_ct_name == 'dh-stats-CORE'
          - core_resource_standard.stats_octet == 245
          - entry.playbook == 'playbooks/core-stats.yml'
          - entry.survey_vars[0].default_value == 'update'
          - entry.survey_vars[0]['values'] | map(attribute='value') | list == ['create','update']
          - "'core-resource-standard-assert.yml' in (audit | to_json)"
          - "'pvesh' in (audit | to_json)"
          - "'core60-cloudflare-audit.yml' in (audit | to_json)"
          - "'core60-cloudflare-prepare.yml' in (audit | to_json)"
          - "'core60-deploy.yml' in (audit | to_json)"
          - "'core60-cloudflare-cutover.yml' in (audit | to_json)"
          - "'core60-update-stats.yml' in (audit | to_json)"
          - "'pct, destroy' not in (lookup('ansible.builtin.file', root ~ '/tasks/core60-update-stats.yml'))"
          - "'core60-network-origin.yml' in (audit | to_json)"
          - "'https://telemetry.digitalhouses.vip/healthz' in (audit | to_json)"
          - "'pct, create' not in (audit | to_json)"
          - "'pct, destroy' not in (audit | to_json)"
          - "'qm, destroy' not in (audit | to_json)"
          - "'zfs' not in (audit | to_json)"
          - "'POST' not in (audit | to_json)"

    - name: Require Debian native cloudflared updates without custom timers
      ansible.builtin.assert:
        that:
          - "'apt-daily.timer apt-daily-upgrade.timer' in (lookup('ansible.builtin.file', root ~ '/files/core60/install-cloudflared.sh'))"
          - "'unattended-upgrades' in (lookup('ansible.builtin.file', root ~ '/files/core60/install-cloudflared.sh'))"
          - "'Package-Whitelist-Strict' in (lookup('ansible.builtin.file', root ~ '/files/core60/cloudflared-unattended.conf'))"
          - "'origin=cloudflared,site=pkg.cloudflare.com' in (lookup('ansible.builtin.file', root ~ '/files/core60/cloudflared-unattended.conf'))"
          - "'cloudflared-dh-core.service' in (lookup('ansible.builtin.file', root ~ '/files/core60/cloudflared-unattended.conf'))"
          - "'cloudflared-dh-core-update.timer' not in (lookup('ansible.builtin.file', root ~ '/tasks/core60-deploy.yml'))"

    - name: Require a fresh local DB, no old HOME imports or destructive lifecycle
      ansible.builtin.assert:
        that:
          - >-
            ((deploy_tasks | selectattr('name', 'equalto', 'Refuse resuming any foreign CT or changed network/disk identity') | first)
              ['ansible.builtin.assert'].that | map('type_debug') | unique | list) == ['str']
          - "'pct' in (deploy_tasks | to_json)"
          - "'create' in (deploy_tasks | to_json)"
          - "'pct, destroy' not in (deploy_tasks | to_json)"
          - "'pct, stop' not in (deploy_tasks | to_json)"
          - "'192.168.11.245' in (deploy_tasks | to_json)"
          - "'cloudflared-dh-core' in (deploy_tasks | to_json)"
          - "'configure-network-origin.sh' in (deploy_tasks | to_json)"
          - "'pg_dump' not in install_script"
          - "'pg_restore' not in install_script"
          - "'alembic' in install_script"
          - "'chmod -R a+rX' in install_script"
          - "'debian-13-standard_' in (deploy_tasks | to_json)"
          - "'https://github.com/DigitalHouses/home-assistant-apps.git' in install_script"

    - name: Require limited public route for fresh deployment
      ansible.builtin.assert:
        that:
          - "'telemetry.digitalhouses.vip' in (cutover | to_json)"
          - "'http://192.168.11.245:8082' in (cutover | to_json)"
          - "'http_status:404' in (cutover | to_json)"
          - "'CORE60_CF_TELEMETRY_DNS_NOT_OWNED_OR_AMBIGUOUS' in (cutover | to_json)"
          - "'core60_create_required' in (audit | to_json)"
          - "'192.168.11.220' not in (cutover | to_json)"

    - name: Require native Debian 13 boot compatibility for new and existing CT1245
      ansible.builtin.assert:
        that:
          - "'nesting=1' in (deploy_tasks | to_json)"
          - "'core60-boot.yml' in (deploy_tasks | to_json)"
          - "'core60-boot.yml' in (lookup('ansible.builtin.file', root ~ '/tasks/core60-network-origin.yml'))"
          - "'Requires=networking.service' in (lookup('ansible.builtin.file', root ~ '/tasks/core60-boot.yml'))"
          - "'After=networking.service' in (lookup('ansible.builtin.file', root ~ '/tasks/core60-boot.yml'))"
          - "'pct, shutdown' in (lookup('ansible.builtin.file', root ~ '/tasks/core60-boot.yml'))"
          - "'pct, destroy' not in (lookup('ansible.builtin.file', root ~ '/tasks/core60-boot.yml'))"
          - "'systemctl, is-system-running, --wait' in (lookup('ansible.builtin.file', root ~ '/tasks/core60-boot.yml'))"
