---
# CORE-only catalog. HOME playbooks and HOME credentials are excluded.
tasks:
  - name: 00-Обновить список задач
    playbook: playbooks/update-task-catalog.yml
    description: Обновить каталог задач CORE из Ansible-CORE (без запуска остальных задач)
  - name: "05-Ввести и проверить credentials"
    playbook: playbooks/obtain-core-credentials.yml
    description: "Единые credentials CORE в Semaphore; пустые поля сохраняют действующие значения"
    survey_vars:
      - {name: DH_INPUT_CLOUDFLARE_API_TOKEN, title: "Cloudflare — API Token (пусто — сохранить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_CLOUDFLARE_TEAM_NAME, title: "Cloudflare Zero Trust — team name (пусто — сохранить прежнее)", type: "", target: env, required: false, values: []}
      - {name: DH_INPUT_CLOUDFLARE_ENROLL_CLIENT_ID, title: "Cloudflare One — enrollment Service Token Client ID (пусто — сохранить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_CLOUDFLARE_ENROLL_CLIENT_SECRET, title: "Cloudflare One — enrollment Service Token Client Secret (пусто — сохранить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_TAILSCALE_AUTH_KEY, title: "Tailscale — auth key для CORE PVE/PBS (пусто — сохранить прежний)", type: secret, target: env, required: false, values: []}
  - name: 40-CORE Infrastructure
    playbook: playbooks/core-pbs.yml
    description: "Audit CORE PVE/PBS infrastructure or prepare pbs-core; no backup synchronization"
    survey_vars:
      - name: DH_CORE40_ACTION
        title: "CORE Infrastructure — действие"
        type: enum
        target: ""
        required: true
        default_value: audit
        values:
          - {name: "Проверить инфраструктуру без изменений", value: audit}
          - {name: "Подготовить ZFS dataset и datastore pbs-core", value: prepare}
          - {name: "Проверить Cloudflare policy, private route и client (без изменений)", value: cf-audit}
          - {name: "Установить пакет Cloudflare One Client без регистрации и маршрутов", value: cf-install}
          - {name: "Зарегистрировать Cloudflare One Client (Posture only, без изменения маршрутов)", value: cf-register}
          - {name: "Создать отдельный неактивный CORE PBS Device Profile (Include HOME /32)", value: cf-profile-prepare}
          - {name: "Проверить HOME №70 и WARP транспорт CORE без изменений", value: cf-transport-audit}
          - {name: "Включить WARP Traffic only CORE→HOME PBS и проверить HTTPS с автооткатом", value: cf-transport-enable}
          - {name: "Включить автоподключение WARP после рестарта и проверить PBS", value: cf-transport-persist}
      - name: DH_CORE40_CF_ACCEPT_TOS
        title: "Согласие с Cloudflare One Client Terms of Service (только для регистрации)"
        type: enum
        target: ""
        required: true
        default_value: "no"
        values:
          - {name: "Не принимаю / не регистрировать", value: "no"}
          - {name: "Принимаю условия Cloudflare и разрешаю регистрацию CORE PBS", value: "yes"}
  - name: 50-Central Backup
    playbook: playbooks/core-backup.yml
    description: "Read-only audit of CORE PBS; HOME Push Sync into per-HOME namespaces, central Verify/Prune/Restore planned"
  - name: 71-Tailscale
    playbook: playbooks/core-tailscale.yml
    description: "CORE PVE + PBS: audit, install, configure, join, update stable Tailscale without altering DNS/default route; WARP migration separate"
    survey_vars:
      - name: DH_CORE71_ACTION
        title: "Tailscale — действие"
        type: enum
        target: ""
        required: true
        default_value: audit
        values:
          - {name: "Проверить состояние без изменений", value: audit}
          - {name: "Установить пакет Tailscale (без регистрации)", value: install}
          - {name: "Настроить DNS/маршруты на подключённом узле", value: configure}
          - {name: "Подключить к tailnet (auth key из №05; PBS только без WARP)", value: join}
          - {name: "Обновить только пакет Tailscale", value: update}
      - name: DH_CORE71_TARGET
        title: "Узел CORE"
        type: enum
        target: ""
        required: true
        default_value: both
        values:
          - {name: "Оба узла последовательно", value: both}
          - {name: "Только CORE PVE", value: pve}
          - {name: "Только CORE PBS VM2243", value: pbs}
