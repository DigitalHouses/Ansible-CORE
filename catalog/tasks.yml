---
# CORE-only catalog. HOME playbooks and HOME credentials are excluded.
tasks:
  - name: 00-Обновить список задач
    playbook: playbooks/update-task-catalog.yml
    description: Обновить каталог задач CORE из Ansible-CORE (без запуска остальных задач)
  - name: "05-Ввести и проверить credentials"
    playbook: playbooks/obtain-core-credentials.yml
    description: "Единые credentials CORE в Semaphore; пустые поля сохраняют действующие значения"
    survey_vars:
      - {name: DH_INPUT_CLOUDFLARE_API_TOKEN, title: "Cloudflare — API Token (пусто — сохранить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_CLOUDFLARE_TEAM_NAME, title: "Cloudflare Zero Trust — team name (пусто — сохранить прежнее)", type: "", target: env, required: false, values: []}
      - {name: DH_INPUT_CLOUDFLARE_ENROLL_CLIENT_ID, title: "Cloudflare One — enrollment Service Token Client ID (пусто — сохранить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_CLOUDFLARE_ENROLL_CLIENT_SECRET, title: "Cloudflare One — enrollment Service Token Client Secret (пусто — сохранить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_TAILSCALE_AUTH_KEY, title: "Tailscale — auth key для CORE PVE/PBS (пусто — сохранить прежний)", type: secret, target: env, required: false, values: []}
  - name: "30-CORE Media E2E"
    playbook: playbooks/core-media-e2e.yml
    description: "CORE standard .243/VM2243: проверить IP, имя VM, портал, nginx, HTTPS и NoCloud; никаких VM recreate или ZFS операций"
    survey_vars:
      - name: DH_CORE_MEDIA_ACTION
        title: "Что проверить или исправить в CORE Media Server?"
        type: enum
        target: ""
        required: true
        default_value: audit
        values:
          - {name: "01 — Проверить весь CORE Media Server (только аудит)", value: audit}
          - {name: "02 — Исправить портал, nginx, HTTPS и cloud-init кеш по IP VM; E2E", value: repair-portal}
          - {name: "03 — Обновить только PVE имя VM2243 на mediaserver-CORE (без остановки)", value: sync-name}
  - name: "31-CORE Media/PBS — Create/Recreate + Import"
    playbook: playbooks/core-media-fresh.yml
    description: "CORE VM2243: с нуля Debian 13, Plex/Jellyfin/Arr/qBit/SMB/PBS/Tailscale; только Import существующего serzhan-pool, без архивов ОС и стирания SATA."
    survey_vars:
      - name: DH_CORE31_ACTION
        title: "CORE №31 — Create/Recreate + Import (чистая Debian 13)"
        type: enum
        target: ""
        required: true
        default_value: audit
        values:
          - {name: "01 — Аудит VM2243 / ZFS (без изменений)", value: audit}
          - {name: "02 — Create/Recreate VM2243 + чистый Debian 13 + ZFS Import (без erase)", value: apply}
          - {name: "03 — Продолжить установку существующей VM2243 (без Recreate)", value: resume}
  - name: 40-CORE Infrastructure
    playbook: playbooks/core-pbs.yml
    description: "Audit CORE PVE/PBS infrastructure or prepare pbs-core; no backup synchronization"
    survey_vars:
      - name: DH_CORE40_ACTION
        title: "CORE Infrastructure — действие"
        type: enum
        target: ""
        required: true
        default_value: audit
        values:
          - {name: "Проверить инфраструктуру без изменений", value: audit}
          - {name: "Подготовить ZFS dataset и datastore pbs-core", value: prepare}
          - {name: "Перенести CORE PVE backup в pbs-core/dh-core и снять legacy регистрации без удаления ZFS", value: retire-legacy}
  - name: 50-Central Backup
    playbook: playbooks/core-backup.yml
    description: "01 аудит всех HOME; 02 подготовить выбранный HOME; 03 ручной Verify; 04 плановые Verify и безопасный отключённый Prune"
    survey_vars:
      - name: DH_CORE50_ACTION
        title: "CORE PBS — действие"
        type: enum
        target: ""
        required: true
        default_value: audit
        values:
          - {name: "01 — Аудит свежести всех HOME (без изменений)", value: audit}
          - {name: "02 — Создать namespace и Push/Restore credentials для HOME", value: prepare}
          - {name: "03 — Verify snapshots выбранного HOME сейчас", value: verify}
          - {name: "04 — Настроить Verify daily и неактивный Prune для HOME", value: maintenance}
      - name: DH_CORE50_HOME_ID
        title: "HOME ID (для 02–04; пример: serzhan-home)"
        type: ""
        target: ""
        required: true
        default_value: serzhan-home
        values: []
  - name: "60-CORE DH Stats"
    playbook: playbooks/core-stats.yml
    description: "Создание DH Stats или обновление существующего CT1245 без удаления статистики"
    survey_vars:
      - name: DH_CORE60_ACTION
        title: "Действие"
        type: enum
        target: ""
        required: true
        default_value: create
        values:
          - {name: "Создать", value: create}
          - {name: "Обновить", value: update}

