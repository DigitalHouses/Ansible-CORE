---
# CORE-only catalog. HOME playbooks and HOME credentials are excluded.
tasks:
  - name: 00-Обновить список задач
    playbook: playbooks/update-task-catalog.yml
    description: Обновить каталог задач CORE из Ansible-CORE (без запуска остальных задач)
  - name: "05-Ввести и проверить credentials"
    playbook: playbooks/obtain-core-credentials.yml
    description: "Единые credentials CORE в Semaphore; пустые поля сохраняют действующие значения"
    survey_vars:
      - {name: DH_INPUT_CLOUDFLARE_API_TOKEN, title: "Cloudflare — API Token (пусто — сохранить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_CLOUDFLARE_TEAM_NAME, title: "Cloudflare Zero Trust — team name (пусто — сохранить прежнее)", type: "", target: env, required: false, values: []}
      - {name: DH_INPUT_CLOUDFLARE_ENROLL_CLIENT_ID, title: "Cloudflare One — enrollment Service Token Client ID (пусто — сохранить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_CLOUDFLARE_ENROLL_CLIENT_SECRET, title: "Cloudflare One — enrollment Service Token Client Secret (пусто — сохранить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_TAILSCALE_AUTH_KEY, title: "Tailscale — auth key для CORE PVE/PBS (пусто — сохранить прежний)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_CORE_MQTT_USERNAME, title: "CORE MQTT — пользователь (пусто — сохранить прежнее)", type: secret, target: env, required: false, values: []}
      - {name: DH_INPUT_CORE_MQTT_PASSWORD, title: "CORE MQTT — пароль (пусто — сохранить прежнее)", type: secret, target: env, required: false, values: []}
  - name: "10-CORE PVE"
    playbook: playbooks/core-pve.yml
    description: "Настройка установленного CORE PVE: Tailscale и PVE Agent с native auto-update; Update обновляет управляемые компоненты без переустановки PVE."
    survey_vars:
      - name: DH_CORE10_ACTION
        title: "Действие"
        type: enum
        target: ""
        required: true
        default_value: update
        values:
          - {name: "Create", value: create}
          - {name: "Update", value: update}
  - name: "30-CORE Media E2E"
    playbook: playbooks/core-media-e2e.yml
    description: "Проверка медиасервера CORE, исправление сетевых настроек и портала, переименование VM без пересоздания или изменения ZFS"
    survey_vars:
      - name: DH_CORE_MEDIA_ACTION
        title: "Действие"
        type: enum
        target: ""
        required: true
        default_value: audit
        values:
          - {name: "Проверить медиасервер", value: audit}
          - {name: "Исправить сетевые настройки и портал", value: repair-portal}
          - {name: "Переименовать VM медиасервера", value: sync-name}
  - name: "31-CORE Media Server + PBS"
    previous_name: "31-CORE Media/PBS — Create/Recreate + Import"
    playbook: playbooks/core-media-fresh.yml
    description: "Create пересоздаёт системный диск с Import. Erase пока заблокирован до реализации чистой PBS/Tailscale идентичности. Update обновляет существующие пакеты и конфигурацию, не затрагивает диски."
    survey_vars:
      - name: DH_CORE31_ACTION
        title: "Действие"
        type: enum
        target: ""
        required: true
        default_value: update
        values:
          - {name: "Create", value: create}
          - {name: "Update", value: update}
      - name: DH_CORE31_DISK_ACTION
        title: "Диски данных (только Create)"
        type: enum
        target: ""
        required: true
        default_value: import
        values:
          - {name: "Import", value: import}
          - {name: "Erase (пока недоступно)", value: erase}
  - name: 40-CORE Infrastructure
    playbook: playbooks/core-pbs.yml
    description: "Проверка PVE и PBS, настройка pbs-core и прав PVE, перенос резервирования CORE со снятием старых регистраций и сохранением данных ZFS"
    survey_vars:
      - name: DH_CORE40_ACTION
        title: "Действие"
        type: enum
        target: ""
        required: true
        default_value: audit
        values:
          - {name: "Проверить PVE и PBS", value: audit}
          - {name: "Настроить хранилище PBS", value: prepare}
          - {name: "Перенести резервирование CORE в pbs-core", value: retire-legacy}
  - name: 50-Central Backup
    playbook: playbooks/core-backup.yml
    description: "Create подготавливает приём копий выбранного HOME, Update актуализирует его настройки Verify и отключённого Prune. HOME не изменяется."
    survey_vars:
      - name: DH_CORE50_ACTION
        title: "Действие"
        type: enum
        target: ""
        required: true
        default_value: update
        values:
          - {name: "Create", value: create}
          - {name: "Update", value: update}
      - name: DH_CORE50_HOME_ID
        title: "HOME ID"
        type: ""
        target: ""
        required: true
        default_value: serzhan-home
        values: []
  - name: "60-CORE DH Stats"
    playbook: playbooks/core-stats.yml
    description: "Создание DH Stats или обновление существующего CT1245 без удаления статистики"
    survey_vars:
      - name: DH_CORE60_ACTION
        title: "Действие"
        type: enum
        target: ""
        required: true
        default_value: update
        values:
          - {name: "Create", value: create}
          - {name: "Update", value: update}
  - name: 71-Tailscale
    playbook: playbooks/core-tailscale.yml
    description: "Управление Tailscale на CORE PVE и PBS; штатное автообновление"
    survey_vars:
      - name: DH_CORE71_ACTION
        title: "Действие"
        type: enum
        target: ""
        required: true
        default_value: audit
        values:
          - {name: "Проверить", value: audit}
          - {name: "Установить", value: install}
          - {name: "Настроить DNS и маршруты", value: configure}
          - {name: "Подключить", value: join}
          - {name: "Обновить", value: update}
      - name: DH_CORE71_TARGET
        title: "Сервер"
        type: enum
        target: ""
        required: true
        default_value: both
        values:
          - {name: "PVE и PBS", value: both}
          - {name: "PVE", value: pve}
          - {name: "PBS", value: pbs}
